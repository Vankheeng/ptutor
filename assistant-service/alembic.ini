# Cau hinh Alembic: migration rieng cua schema assistant (thiet ke 06 muc 6.1), doc lap voi Flyway cua backend.
# Dia chi DB lay tu bien ASSISTANT_DATABASE_URL (migrations/env.py). File nay de ASCII vi Alembic doc bang ma hoa mac dinh cua Windows.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
