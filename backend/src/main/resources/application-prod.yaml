spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ptutor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:xxxxxxxxxxxx@gmail.com}
    password: ${MAIL_PASSWORD:xxxx xxxx xxxx xxxx}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:xxxxx@xxxx.xxxx}}
  security:
    jwt:
      secret: ${JWT_SECRET:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
      issuer: ${JWT_ISSUER:ptutor-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:3600}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:2592000}
    citizen-id-encryption-key: ${CITIZEN_ID_ENCRYPTION_KEY:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
