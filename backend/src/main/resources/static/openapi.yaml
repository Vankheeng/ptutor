openapi: 3.0.3
info:
  title: PTutor API
  version: 1.0.0
  description: API documentation for the PTutor tutoring platform.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Authentication
    description: Registration and authentication operations
  - name: Password Reset
    description: Email OTP operations for resetting a forgotten password
  - name: Student Profile
    description: Operations for the authenticated student's own profile
  - name: Studying Requests
    description: Student requests for finding a tutor
  - name: Tutor Student Requests
    description: Tutor teaching proposals and student responses for studying requests
  - name: Complaints
    description: Complaints from student or tutor contract participants
  - name: Account
    description: Operations for the authenticated user's own account
  - name: Tutor Profiles
    description: Public tutor profile operations available to authenticated users
  - name: Tutor Certificates
    description: Certificate management for the authenticated tutor
  - name: Teaching Requests
    description: Tutor teaching-request management and authenticated request browsing
  - name: Subjects
    description: Active subject catalog used by teaching requests
  - name: Grades
    description: Active grade catalog used by teaching requests
  - name: Districts
    description: District catalog used by profile and teaching-request forms
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a student or tutor account
      description: Creates a user account and its student or tutor profile. Employee and admin registration is not allowed.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: student01@example.com
              password: Password123
              role: STUDENT
              firstName: Nguyen
              lastName: An
              phone: '0900000000'
              gender: MALE
              dateOfBirth: '2005-01-01'
              citizenId: '012345678901'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
      responses:
        '201':
          description: Account registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticates a student, tutor, employee or admin using email and password.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: student01@example.com
              password: Password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access and refresh tokens
      description: Rotates a valid opaque refresh token. An access JWT is not required for this endpoint.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: paste-refresh-token-here
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Revokes the supplied refresh token. The operation is idempotent and does not require an access JWT.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: paste-refresh-token-here
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password-reset/otp:
    post:
      tags: [Password Reset]
      summary: Send a password reset OTP
      description: Invalidates previous unused OTPs and sends a new six-digit OTP to the registered email. The OTP expires after five minutes.
      operationId: sendPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPasswordResetOtpRequest'
            example:
              email: student01@example.com
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/EmailNotFoundError'
        '503':
          $ref: '#/components/responses/EmailDeliveryError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password-reset/verify:
    post:
      tags: [Password Reset]
      summary: Verify a password reset OTP
      description: Checks the latest OTP for the email without consuming it or extending its expiry time.
      operationId: verifyPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordResetOtpRequest'
            example:
              email: student01@example.com
              otp: '123456'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifiedResponseEnvelope'
        '400':
          $ref: '#/components/responses/InvalidOtpError'
        '404':
          $ref: '#/components/responses/EmailNotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password-reset/reset:
    post:
      tags: [Password Reset]
      summary: Reset a forgotten password
      description: Revalidates and atomically consumes the OTP, then stores the new password as a BCrypt hash. Existing sessions remain valid.
      operationId: resetForgottenPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              email: student01@example.com
              otp: '123456'
              newPassword: NewPassword456
              confirmNewPassword: NewPassword456
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponseEnvelope'
        '400':
          $ref: '#/components/responses/InvalidOtpError'
        '404':
          $ref: '#/components/responses/EmailNotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me:
    get:
      tags:
        - Student Profile
      summary: Get the authenticated student's profile
      description: Returns the profile associated with the user ID from the access JWT. Only students can call this endpoint.
      operationId: getCurrentStudentProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Student Profile
      summary: Partially update the authenticated student's profile
      description: Updates only non-null fields. Province and district IDs must be supplied together. Email and sensitive fields cannot be updated.
      operationId: updateCurrentStudentProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
            example:
              firstName: Nguyen Van
              phone: '0912345678'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              detailAddress: 123 Example Street
              introduction: I am preparing for university entrance exams.
      responses:
        '200':
          description: Student profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/password:
    put:
      tags:
        - Account
      summary: Change the authenticated user's password
      description: Changes the password for the user identified by the access JWT. Existing access and refresh tokens remain valid.
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: Password123
              newPassword: NewPassword456
              confirmNewPassword: NewPassword456
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tutors/me:
    get:
      tags:
        - Tutor Profiles
      summary: Get my tutor profile
      description: Returns the authenticated tutor's own profile, including personal contact and address information.
      operationId: getMyTutorProfile
      responses:
        '200':
          description: Tutor profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorSelfProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Tutor Profiles
      summary: Partially update my tutor profile
      description: Updates the authenticated tutor's personal, address and professional profile fields. Null fields are left unchanged. Email, password, citizen ID, account status, ratings and statistics cannot be updated.
      operationId: updateMyTutorProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTutorProfileRequest'
            example:
              firstName: Nguyen Van
              phone: '0912345678'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              detailAddress: 123 Example Street
              introduction: Experienced English tutor
              experienceYears: 5
              education: Bachelor of English
              teachingStyleTags: Patient, practical
              teachingMethodology: Communicative learning
              strengthSubjects: English, IELTS
              targetStudentType: High school students
      responses:
        '200':
          description: Tutor profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorSelfProfileResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tutors/{tutorId}:
    parameters:
      - $ref: '#/components/parameters/TutorId'
    get:
      tags:
        - Tutor Profiles
      summary: Get a tutor profile
      description: Returns the public profile of a tutor. This endpoint is available to all authenticated users.
      operationId: getTutorProfile
      responses:
        '200':
          description: Tutor profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/students/me/studying-requests:
    get:
      tags:
        - Studying Requests
      summary: List my studying requests
      description: Returns only studying requests owned by the authenticated student. Results are sorted by creation time descending and support optional status filtering.
      operationId: listMyStudyingRequests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StudyingRequestStatus'
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of records per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated studying requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyingRequestPageResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Studying Requests
      summary: Create a studying request
      description: Creates a studying request for the authenticated student. New requests start in DRAFT and are activated after a future successful payment.
      operationId: createMyStudyingRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyingRequestRequest'
            example:
              subjectId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              gradeId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              title: Need an English tutor for grade 10
              description: I need help preparing for the semester exam.
              note: Prefer a patient tutor.
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              detailAddress: 123 Example Street
              minPrice: 100000
              maxPrice: 200000
              learningGoals: Improve grammar and reading comprehension
              learningMode: ONLINE
              preferredSchedule: Weekday evenings
              availabilities:
                - dayOfWeek: 2
                  startTime: '18:00:00'
                  endTime: '20:00:00'
      responses:
        '201':
          description: Studying request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/students/me/studying-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/StudyingRequestId'
    get:
      tags:
        - Studying Requests
      summary: Get my studying request
      description: Returns a studying request only when it belongs to the authenticated student identified by the JWT.
      operationId: getMyStudyingRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Studying request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Studying Requests
      summary: Partially update my studying request
      description: Updates only supplied business fields of a DRAFT or OPEN studying request owned by the authenticated student. Null or omitted fields are kept unchanged.
      operationId: updateMyStudyingRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyingRequestUpdateRequest'
            example:
              title: Need an English tutor for grade 10 - updated
              maxPrice: 250000
              preferredSchedule: Weekend mornings
      responses:
        '200':
          description: Studying request updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me/studying-requests/{requestId}/status:
    parameters:
      - $ref: '#/components/parameters/StudyingRequestId'
    patch:
      tags:
        - Studying Requests
      summary: Update my studying request status
      description: Changes only between OPEN and CLOSED for an owned studying request. DRAFT is activated by the payment flow, while MATCHED and CANCELLED cannot be changed through this endpoint.
      operationId: updateMyStudyingRequestStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyingRequestStatusRequest'
            example:
              status: CLOSED
      responses:
        '200':
          description: Studying request status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me/studying-requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/StudyingRequestId'
    post:
      tags:
        - Studying Requests
      summary: Cancel my studying request
      description: Cancels a DRAFT, OPEN, MATCHED or CLOSED request. Pending and accepted tutor offers for the request are also cancelled.
      operationId: cancelMyStudyingRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Studying request cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tutors/me/studying-requests/{studyingRequestId}/tutor-student-requests:
    parameters:
      - $ref: '#/components/parameters/TutorStudentStudyingRequestId'
    post:
      tags:
        - Tutor Student Requests
      summary: Send a teaching proposal to a studying request
      description: An authenticated tutor sends a PENDING proposal to teach an OPEN studying request. A tutor may have only one pending proposal for the same studying request.
      operationId: createTutorStudentRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorStudentRequestCreateRequest'
            example:
              gradeId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              proposedPrice: 150000
              teachingMode: ONLINE
              preferredSchedule: Weekday evenings
              message: I can help with exam preparation and build a weekly study plan.
      responses:
        '201':
          description: Teaching proposal created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorStudentRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/tutors/me/tutor-student-requests:
    get:
      tags:
        - Tutor Student Requests
      summary: List my teaching proposals
      description: Returns proposals sent by the authenticated tutor, ordered by creation time descending. Optionally filter by status.
      operationId: listMyTutorStudentRequests
      parameters:
        - $ref: '#/components/parameters/TutorStudentRequestStatus'
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of records per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated tutor teaching proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorStudentRequestPageResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/tutors/me/tutor-student-requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TutorStudentRequestId'
    post:
      tags:
        - Tutor Student Requests
      summary: Cancel my pending teaching proposal
      description: Cancels a proposal only when it belongs to the authenticated tutor and is still PENDING.
      operationId: cancelMyTutorStudentRequest
      responses:
        '200':
          description: Teaching proposal cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorStudentRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/students/me/studying-requests/{studyingRequestId}/tutor-requests:
    parameters:
      - $ref: '#/components/parameters/TutorStudentStudyingRequestId'
    get:
      tags:
        - Tutor Student Requests
      summary: List tutor offers for my studying request
      description: Returns tutor offers sent to a studying request owned by the authenticated student. Results support pagination and optional status filtering.
      operationId: listTutorStudentRequestsForMyStudyingRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TutorStudentRequestStatus'
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of records per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated tutor offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorStudentRequestPageResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me/studying-requests/{studyingRequestId}/tutor-requests/{tutorRequestId}:
    parameters:
      - $ref: '#/components/parameters/TutorStudentStudyingRequestId'
      - $ref: '#/components/parameters/TutorStudentOfferRequestId'
    get:
      tags:
        - Tutor Student Requests
      summary: Get one tutor offer for my studying request
      description: Returns a tutor offer only when the related studying request belongs to the authenticated student.
      operationId: getTutorStudentRequestForMyStudyingRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tutor offer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorStudentRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me/studying-requests/{studyingRequestId}/tutor-requests/{tutorRequestId}/accept:
    parameters:
      - $ref: '#/components/parameters/TutorStudentStudyingRequestId'
      - $ref: '#/components/parameters/TutorStudentOfferRequestId'
    patch:
      tags:
        - Tutor Student Requests
      summary: Accept a tutor offer
      description: Accepts a PENDING tutor offer. When the accepted count reaches quantity, the studying request becomes MATCHED.
      operationId: acceptTutorStudentRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tutor offer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorStudentRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me/studying-requests/{studyingRequestId}/tutor-requests/{tutorRequestId}/reject:
    parameters:
      - $ref: '#/components/parameters/TutorStudentStudyingRequestId'
      - $ref: '#/components/parameters/TutorStudentOfferRequestId'
    patch:
      tags:
        - Tutor Student Requests
      summary: Reject a tutor offer
      description: Rejects a PENDING tutor offer sent to the authenticated student's studying request.
      operationId: rejectTutorStudentRequest
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tutor offer rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorStudentRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/complaints:
    post:
      tags: [Complaints]
      summary: Submit a complaint
      description: The authenticated student or tutor submits a PENDING complaint for one of their contracts, with optional evidence URLs.
      operationId: createMyComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintCreateRequest'
      responses:
        '201':
          description: Complaint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    get:
      tags: [Complaints]
      summary: List my complaints
      operationId: listMyComplaints
      parameters:
        - $ref: '#/components/parameters/ComplaintStatus'
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated complaints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintPageResponseEnvelope'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /api/v1/users/me/complaints/{complaintId}:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    get:
      tags: [Complaints]
      summary: Get my complaint status and resolution
      operationId: getMyComplaint
      responses:
        '200':
          description: Complaint detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Complaints]
      summary: Update my pending complaint
      description: Updates title and content only while the complaint is PENDING. Omit evidences to retain them; send an empty array to remove all evidence.
      operationId: updateMyComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintUpdateRequest'
      responses:
        '200':
          description: Complaint updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/v1/users/me/complaints/{complaintId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Complaints]
      summary: Cancel my pending complaint
      description: Cancels a complaint only when it belongs to the authenticated user and is still PENDING.
      operationId: cancelMyComplaint
      responses:
        '200':
          description: Complaint cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/v1/tutors/me/teaching-requests:
    post:
      tags:
        - Teaching Requests
      summary: Create a teaching request
      description: Creates a DRAFT request until payment is confirmed. After payment, an existing subject is activated as OPEN and a custom subject is sent to PENDING_REVIEW.
      operationId: createMyTeachingRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingRequestRequest'
            example:
              subjectId: 1f8f8a2a-29e4-4f65-a5d5-2a2c9fdc6c3c
              gradeIds:
                - 4e5f8a08-41fb-4f14-85f7-01c9cfb5a2b0
              title: Math tutor for secondary students
              note: Looking for students in the evening
              quantity: 3
              districtIds:
                - 20b7f1d4-9a6d-4c4d-98cb-4c8c30a752f2
              detailAddress: District 1
              expectedPrice: 150000
              teachingMode: OFFLINE
              preferredSchedule: Weekday evenings
              description: I am available for one-to-one or small-group tutoring.
              availabilities:
                - dayOfWeek: 2
                  startTime: '18:00:00'
                  endTime: '20:00:00'
      responses:
        '201':
          description: Teaching request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      tags:
        - Teaching Requests
      summary: List my teaching requests
      description: Returns all teaching requests created by the authenticated tutor. An optional status filter can be supplied.
      operationId: listMyTeachingRequests
      parameters:
        - $ref: '#/components/parameters/TeachingRequestStatus'
      responses:
        '200':
          description: Teaching requests belonging to the authenticated tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestListResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/tutors/me/teaching-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    get:
      tags:
        - Teaching Requests
      summary: Get one of my teaching requests
      operationId: getMyTeachingRequest
      responses:
        '200':
          description: Teaching request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Teaching Requests
      summary: Update one of my teaching requests
      description: Updates a DRAFT, OPEN or PENDING_REVIEW request. A DRAFT remains hidden and stays DRAFT until payment. For an already activated request, changing from an existing subject to a custom subject sends it back to PENDING_REVIEW.
      operationId: updateMyTeachingRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingRequestRequest'
      responses:
        '200':
          description: Teaching request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/tutors/me/teaching-requests/{requestId}/status:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    patch:
      tags:
        - Teaching Requests
      summary: Update teaching request status
      description: Tutors can only switch an existing OPEN request to CLOSED or a CLOSED request back to OPEN.
      operationId: updateMyTeachingRequestStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingRequestStatusRequest'
            example:
              status: CLOSED
      responses:
        '200':
          description: Teaching request status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/tutors/me/teaching-requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    post:
      tags:
        - Teaching Requests
      summary: Cancel one of my teaching requests
      description: Cancels a DRAFT, OPEN, CLOSED or PENDING_REVIEW request by changing its status to CANCELLED.
      operationId: cancelMyTeachingRequest
      responses:
        '200':
          description: Teaching request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/tutors/me/teaching-requests/{teachingRequestId}/student-requests:
    parameters:
      - $ref: '#/components/parameters/StudentTutorTeachingRequestId'
    get:
      tags:
        - Student Tutor Requests
      summary: List student applications for my teaching request
      description: Returns applications sent to one teaching request owned by the authenticated tutor. Optionally filter by application status.
      operationId: listStudentTutorRequestsForMyTeachingRequest
      parameters:
        - $ref: '#/components/parameters/StudentTutorRequestStatus'
      responses:
        '200':
          description: Student applications for the teaching request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTutorRequestListResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tutors/me/teaching-requests/{teachingRequestId}/student-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/StudentTutorTeachingRequestId'
      - $ref: '#/components/parameters/StudentTutorRequestId'
    get:
      tags:
        - Student Tutor Requests
      summary: Get one student application for my teaching request
      operationId: getStudentTutorRequestForMyTeachingRequest
      responses:
        '200':
          description: Student application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTutorRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tutors/me/teaching-requests/{teachingRequestId}/student-requests/{requestId}/status:
    parameters:
      - $ref: '#/components/parameters/StudentTutorTeachingRequestId'
      - $ref: '#/components/parameters/StudentTutorRequestId'
    patch:
      tags:
        - Student Tutor Requests
      summary: Accept or reject a student application
      description: Only PENDING applications can be changed. Use ACCEPTED to move the teaching request to MATCHED and continue to contract signing, or REJECTED to decline it.
      operationId: updateStudentTutorRequestStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTutorRequestStatusRequest'
            example:
              status: ACCEPTED
      responses:
        '200':
          description: Student application status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTutorRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/subjects:
    get:
      tags:
        - Subjects
      summary: Get all active subjects
      description: Returns the active subjects available when creating or updating a teaching request.
      operationId: listActiveSubjects
      responses:
        '200':
          description: Active subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/grades:
    get:
      tags:
        - Grades
      summary: Get all active grades
      description: Returns active grades ordered from grade 1 to grade 12 for teaching-request forms.
      operationId: listActiveGrades
      responses:
        '200':
          description: Active grades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/teaching-requests:
    get:
      tags:
        - Teaching Requests
      summary: Browse teaching requests
      description: Students and tutors see only OPEN requests. Employees and admins see all requests and statuses.
      operationId: listVisibleTeachingRequests
      responses:
        '200':
          description: Visible teaching requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/teaching-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    get:
      tags:
        - Teaching Requests
      summary: Get a visible teaching request
      description: Students and tutors can view OPEN requests. Employees and admins can view requests in every status.
      operationId: getVisibleTeachingRequest
      responses:
        '200':
          description: Teaching request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/districts:
    get:
      tags:
        - Districts
      summary: Get districts
      description: Returns all districts ordered by province and district name. Use provinceId to filter districts belonging to one province.
      operationId: listDistricts
      parameters:
        - name: provinceId
          in: query
          required: false
          description: Optional province identifier used to filter the result.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Districts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictListResponseEnvelope'
        '400':
          description: The provinceId is invalid or does not identify an existing province
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/tutors/me/certificates:
    post:
      tags:
        - Tutor Certificates
      summary: Upload a certificate record
      description: Creates a certificate record for the authenticated tutor. New certificates are always created with PENDING status.
      operationId: createMyCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRequest'
            example:
              name: IELTS 8.0
              issuingOrganization: British Council
              description: English language certificate
              issueDate: '2025-05-20'
              expiryDate: '2027-05-20'
              certificateUrl: https://cdn.example.com/certificates/ielts.pdf
      responses:
        '201':
          description: Certificate created and queued for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      tags:
        - Tutor Certificates
      summary: List my certificates
      description: Returns all certificates when status is omitted, or certificates with the requested status.
      operationId: listMyCertificates
      parameters:
        - name: status
          in: query
          required: false
          description: Optional certificate status filter.
          schema:
            type: string
            enum:
              - PENDING
              - VERIFIED
              - REJECTED
              - EXPIRED
      responses:
        '200':
          description: Certificates belonging to the authenticated tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/tutors/{tutorId}/certificates:
    parameters:
      - $ref: '#/components/parameters/TutorId'
    get:
      tags:
        - Tutor Certificates
      summary: List a tutor's verified certificates
      description: Returns only VERIFIED certificates and is available to authenticated students.
      operationId: listTutorVerifiedCertificates
      responses:
        '200':
          description: Verified certificates belonging to the requested tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tutors/me/certificates/{certificateId}:
    parameters:
      - $ref: '#/components/parameters/CertificateId'
    get:
      tags:
        - Tutor Certificates
      summary: Get one of my certificates
      operationId: getMyCertificate
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Tutor Certificates
      summary: Update one of my certificates
      description: Updating a pending or rejected certificate sends it back to PENDING. Verified certificates cannot be edited.
      operationId: updateMyCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRequest'
      responses:
        '200':
          description: Certificate updated and queued for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      tags:
        - Tutor Certificates
      summary: Delete one of my certificates
      operationId: deleteMyCertificate
      responses:
        '200':
          description: Certificate deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateDeleteResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeachingRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudyingRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudyingRequestStatus:
      name: status
      in: query
      required: false
      description: Optional studying-request status filter.
      schema:
        type: string
        enum:
          - DRAFT
          - OPEN
          - MATCHED
          - CLOSED
          - CANCELLED
    TutorStudentStudyingRequestId:
      name: studyingRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TutorStudentRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TutorStudentOfferRequestId:
      name: tutorRequestId
      in: path
      required: true
      description: Tutor offer ID in the student's studying request.
      schema:
        type: string
        format: uuid
    TutorStudentRequestStatus:
      name: status
      in: query
      required: false
      description: Optional tutor teaching-proposal status filter.
      schema:
        type: string
        enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]
    ComplaintId:
      name: complaintId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComplaintStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [PENDING, IN_REVIEW, RESOLVED, REJECTED, CANCELLED]
    TeachingRequestStatus:
      name: status
      in: query
      required: false
      description: Optional teaching-request status filter.
      schema:
        type: string
        enum:
          - DRAFT
          - PENDING_REVIEW
          - OPEN
          - MATCHED
          - CLOSED
          - CANCELLED
          - REJECTED
    StudentTutorTeachingRequestId:
      name: teachingRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentTutorRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentTutorRequestStatus:
      name: status
      in: query
      required: false
      description: Optional student-application status filter.
      schema:
        type: string
        enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]
    TutorId:
      name: tutorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
        - firstName
        - lastName
        - phone
        - gender
        - dateOfBirth
        - citizenId
        - provinceId
        - districtId
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date
        citizenId:
          type: string
          pattern: '^\d{12}$'
          example: '012345678901'
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1

    SendPasswordResetOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255

    VerifyPasswordResetOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        otp:
          type: string
          pattern: '^\\d{6}$'
          example: '123456'

    ResetPasswordRequest:
      type: object
      required: [email, otp, newPassword, confirmNewPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        otp:
          type: string
          pattern: '^\\d{6}$'
          example: '123456'
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        confirmNewPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    OtpVerificationResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          example: true

    UpdateStudentProfileRequest:
      type: object
      description: At least one property must contain a non-null value.
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
          format: date
        avatarUrl:
          type: string
          maxLength: 500
        detailAddress:
          type: string
          maxLength: 255
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid
        introduction:
          type: string
        learningStyle:
          type: string
          maxLength: 50
        personalityTags:
          type: string
          maxLength: 255
        goalsDescription:
          type: string
        currentLevel:
          type: string
          maxLength: 50
        weakPoints:
          type: string

    UpdateTutorProfileRequest:
      type: object
      description: All fields are optional. Null fields are left unchanged. Province and district IDs must be supplied together.
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
          format: date
        avatarUrl:
          type: string
          maxLength: 500
        detailAddress:
          type: string
          maxLength: 255
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid
        introduction:
          type: string
        experienceYears:
          type: integer
          minimum: 0
        education:
          type: string
        teachingStyleTags:
          type: string
          maxLength: 255
        teachingMethodology:
          type: string
        strengthSubjects:
          type: string
        targetStudentType:
          type: string
          maxLength: 255

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmNewPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        confirmNewPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    CertificateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        issuingOrganization:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
          description: Must be on or after issueDate when both dates are provided.
        certificateUrl:
          type: string
          maxLength: 500

    StudyingRequestRequest:
      type: object
      description: Creates a student request to find a tutor. The request starts in DRAFT until payment activates it.
      required:
        - subjectId
        - gradeId
        - title
        - learningMode
      properties:
        subjectId:
          type: string
          format: uuid
        gradeId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
          nullable: true
        note:
          type: string
          maxLength: 255
          nullable: true
        districtId:
          type: string
          format: uuid
          nullable: true
        detailAddress:
          type: string
          maxLength: 255
          nullable: true
        minPrice:
          type: number
          format: double
          minimum: 0
          nullable: true
        maxPrice:
          type: number
          format: double
          minimum: 0
          nullable: true
        learningGoals:
          type: string
          maxLength: 10000
          nullable: true
        learningMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          maxLength: 500
          nullable: true
        availabilities:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/StudyingRequestAvailabilityRequest'

    StudyingRequestUpdateRequest:
      type: object
      description: Partially updates a DRAFT or OPEN studying request. Omitted or null fields remain unchanged. If availabilities is supplied, it replaces the complete availability list.
      properties:
        subjectId:
          type: string
          format: uuid
          nullable: true
        gradeId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 255
          nullable: true
        note:
          type: string
          maxLength: 255
          nullable: true
        districtId:
          type: string
          format: uuid
          nullable: true
        detailAddress:
          type: string
          maxLength: 255
          nullable: true
        minPrice:
          type: number
          format: double
          minimum: 0
          nullable: true
        maxPrice:
          type: number
          format: double
          minimum: 0
          nullable: true
        learningGoals:
          type: string
          maxLength: 10000
          nullable: true
        learningMode:
          type: string
          enum: [OFFLINE, ONLINE]
          nullable: true
        preferredSchedule:
          type: string
          maxLength: 500
          nullable: true
        availabilities:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/StudyingRequestAvailabilityRequest'

    TutorStudentRequestCreateRequest:
      type: object
      required:
        - gradeId
        - proposedPrice
        - teachingMode
      properties:
        gradeId:
          type: string
          format: uuid
        proposedPrice:
          type: number
          format: double
          minimum: 0
        teachingMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          maxLength: 500
          nullable: true
        message:
          type: string
          maxLength: 10000
          nullable: true

    ComplaintCreateRequest:
      type: object
      required: [contractId, title, content]
      properties:
        contractId: { type: string, format: uuid }
        title: { type: string, maxLength: 255 }
        content: { type: string, maxLength: 10000 }
        evidences:
          type: array
          items:
            type: object
            required: [fileUrl, fileType]
            properties:
              fileUrl: { type: string, maxLength: 2048 }
              fileType: { type: string, maxLength: 100 }

    ComplaintUpdateRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 255 }
        content: { type: string, maxLength: 10000 }
        evidences:
          type: array
          description: Omit to retain existing evidence; send an empty array to remove all evidence.
          items:
            type: object
            required: [fileUrl, fileType]
            properties:
              fileUrl: { type: string, maxLength: 2048 }
              fileType: { type: string, maxLength: 100 }

    StudyingRequestStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED]

    StudyingRequestAvailabilityRequest:
      type: object
      required:
        - dayOfWeek
        - startTime
        - endTime
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
          description: Must be after startTime.

    StudyingRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        subjectName:
          type: string
        gradeId:
          type: string
          format: uuid
        gradeName:
          type: string
        districtId:
          type: string
          format: uuid
          nullable: true
        districtName:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        detailAddress:
          type: string
          nullable: true
        minPrice:
          type: number
          format: double
          nullable: true
        maxPrice:
          type: number
          format: double
          nullable: true
        learningGoals:
          type: string
          nullable: true
        learningMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          nullable: true
        availabilities:
          type: array
          items:
            $ref: '#/components/schemas/StudyingRequestAvailabilityResponse'
        status:
          type: string
          enum: [DRAFT, OPEN, MATCHED, CLOSED, CANCELLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudyingRequestPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/StudyingRequestResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean

    TutorStudentRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tutorId:
          type: string
          format: uuid
        tutorFirstName:
          type: string
        tutorLastName:
          type: string
        tutorEmail:
          type: string
          format: email
        studyingRequestId:
          type: string
          format: uuid
        studyingRequestTitle:
          type: string
        subjectId:
          type: string
          format: uuid
        subjectName:
          type: string
        gradeId:
          type: string
          format: uuid
        gradeName:
          type: string
        proposedPrice:
          type: number
          format: double
        teachingMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]
        nextStep:
          type: string
          nullable: true
          description: CONTRACT_SIGNING when the offer is accepted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TutorStudentRequestPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TutorStudentRequestResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean

    ComplaintResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        status:
          type: string
          enum: [PENDING, IN_REVIEW, RESOLVED, REJECTED, CANCELLED]
        resolution: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        evidences:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              fileUrl: { type: string }
              fileType: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ComplaintPageResponse:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ComplaintResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }

    StudyingRequestAvailabilityResponse:
      type: object
      properties:
        dayOfWeek:
          type: integer
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    TeachingRequestAvailabilityRequest:
      type: object
      required:
        - dayOfWeek
        - startTime
        - endTime
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    TeachingRequestRequest:
      type: object
      description: Provide exactly one of subjectId or customSubjectName.
      required:
        - gradeIds
        - title
        - quantity
        - expectedPrice
        - teachingMode
      properties:
        subjectId:
          type: string
          format: uuid
          nullable: true
        customSubjectName:
          type: string
          maxLength: 100
          nullable: true
          description: A subject not yet available in the catalog. Requests using this field require review.
        gradeIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        title:
          type: string
          maxLength: 255
        note:
          type: string
          maxLength: 255
          nullable: true
        quantity:
          type: integer
          minimum: 1
        districtIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        detailAddress:
          type: string
          maxLength: 255
          nullable: true
        expectedPrice:
          type: number
          format: double
          minimum: 0
        teachingMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          maxLength: 500
          nullable: true
        description:
          type: string
          maxLength: 10000
          nullable: true
        availabilities:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TeachingRequestAvailabilityRequest'

    TeachingRequestStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED]

    StudentTutorRequestStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED]
          description: Only ACCEPTED or REJECTED can be submitted by a tutor.

    StudentTutorRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        studentFirstName:
          type: string
        studentLastName:
          type: string
        studentEmail:
          type: string
          format: email
        gradeId:
          type: string
          format: uuid
        gradeName:
          type: string
        teachingRequestId:
          type: string
          format: uuid
        proposedPrice:
          type: number
          format: double
        learningMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]
        nextStep:
          type: string
          nullable: true
          description: CONTRACT_SIGNING when the application is accepted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeachingRequestAvailabilityResponse:
      type: object
      properties:
        dayOfWeek:
          type: integer
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    TeachingRequestReferenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    TeachingRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tutorId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        subjectName:
          type: string
          nullable: true
        customSubjectName:
          type: string
          nullable: true
        grades:
          type: array
          items:
            $ref: '#/components/schemas/TeachingRequestReferenceResponse'
        districts:
          type: array
          items:
            $ref: '#/components/schemas/TeachingRequestReferenceResponse'
        title:
          type: string
        note:
          type: string
          nullable: true
        quantity:
          type: integer
        detailAddress:
          type: string
          nullable: true
        expectedPrice:
          type: number
          format: double
        teachingMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        availabilities:
          type: array
          items:
            $ref: '#/components/schemas/TeachingRequestAvailabilityResponse'
        studentRequestCount:
          type: integer
          format: int64
          description: Total number of student applications for this teaching request.
        pendingStudentRequestCount:
          type: integer
          format: int64
          description: Number of pending student applications for this teaching request.
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, OPEN, MATCHED, CLOSED, CANCELLED, REJECTED]
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TutorProfileResponse:
      type: object
      properties:
        tutorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        introduction:
          type: string
          nullable: true
        experienceYears:
          type: integer
          nullable: true
        education:
          type: string
          nullable: true
        teachingStyleTags:
          type: string
          nullable: true
        teachingMethodology:
          type: string
          nullable: true
        strengthSubjects:
          type: string
          nullable: true
        targetStudentType:
          type: string
          nullable: true
        averageRating:
          type: number
          format: double
        totalReviews:
          type: integer
        completedContractsCount:
          type: integer
        totalStudentsTaught:
          type: integer
        acceptanceRate:
          type: number
          format: double
          nullable: true
        avgResponseTimeHours:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TutorSelfProfileResponse:
      allOf:
        - $ref: '#/components/schemas/TutorProfileResponse'
        - type: object
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
              nullable: true
            gender:
              type: string
              nullable: true
              enum: [MALE, FEMALE, OTHER]
            dateOfBirth:
              type: string
              format: date
              nullable: true
            address:
              $ref: '#/components/schemas/AddressResponse'

    CertificateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tutorId:
          type: string
          format: uuid
        name:
          type: string
        issuingOrganization:
          type: string
        description:
          type: string
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        certificateUrl:
          type: string
        status:
          type: string
          readOnly: true
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
            - EXPIRED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GradeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Lớp 1
        level:
          type: integer
          example: 1
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DistrictResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ba Đình
        provinceId:
          type: string
          format: uuid
        provinceName:
          type: string
          example: Hà Nội
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
            - EMPLOYEE
            - ADMIN

    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        accessTokenExpiresIn:
          type: integer
          format: int64
          example: 3600
        refreshTokenExpiresIn:
          type: integer
          format: int64
          example: 2592000
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
            - EMPLOYEE
            - ADMIN

    AddressResponse:
      type: object
      properties:
        detailAddress:
          type: string
          nullable: true
        districtId:
          type: string
          format: uuid
          nullable: true
        districtName:
          type: string
          nullable: true
