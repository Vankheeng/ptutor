# Danh mục công cụ tra cứu của trợ lý hỗ trợ PTutor.
# Sinh từ code nhánh dev; tools.xlsx được sinh từ file này bằng build_xlsx.py.
# Khối x-shared chỉ chứa định nghĩa dùng chung (YAML anchor), không phải công cụ.
catalog:
  version: 1
  source_branch: dev
  source_commit: 27f6eeb09815385bf92d3d552b0f8f705070a23c
  updated: 2026-11-03
  spec: "feat/support-chatbot:docs/support-chatbot/05-cong-cu-tra-cuu.md"

# Lớp bọc kết quả chung, áp dụng cho mọi công cụ.
wrapper:
  ApiResponse:
    description: Mọi API trả về cùng một lớp bọc. Dữ liệu cần đọc nằm ở trường data.
    source: response/ApiResponse.java, response/ApiResponseFactory.java
    fields:
      success: {type: boolean, description: "true khi thành công, false khi lỗi"}
      code: {type: String, description: "SUCCESS khi thành công; mã lỗi khi thất bại (xem common_errors và errors của từng công cụ)"}
      message: {type: String, description: "Câu mô tả tiếng Anh của máy chủ; không đưa nguyên văn cho người dùng"}
      data: {type: "T", description: "Dữ liệu kết quả; null khi lỗi"}
      errors: {type: "Map<String,String>", description: "Lỗi theo từng tham số khi kiểm tra dữ liệu thất bại; rỗng khi thành công"}
      timestamp: {type: Instant, description: "Thời điểm máy chủ trả lời"}
      path: {type: String, description: "Đường dẫn đã gọi"}
  PageResponse:
    description: Với công cụ có phân trang, data là PageResponse; các mục nằm ở data.content.
    source: dto/response/PageResponse.java
    fields:
      content: {type: "List<T>", description: "Các mục của trang hiện tại"}
      page: {type: int, description: "Số trang, bắt đầu từ 0"}
      size: {type: int, description: "Số mục tối đa mỗi trang"}
      totalElements: {type: long, description: "Tổng số mục khớp bộ lọc; dùng để nói 'bạn có N …'"}
      totalPages: {type: int, description: "Tổng số trang"}
      first: {type: boolean, description: "Đây là trang đầu"}
      last: {type: boolean, description: "Đây là trang cuối"}
  time_zones:
    # Quyết định 2026-11-03 (bản sửa trong worktree feat/support-chatbot-claude): backend GIỮ giờ Việt Nam như nhóm
    # đang chạy (JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh, Docker TZ=Asia/Ho_Chi_Minh). Không sửa
    # ContractTimeProvider.now(). Mỗi trường thời điểm ghi rõ nguồn múi giờ theo code (tìm bằng grep now(clock)).
    backend_jvm_time_zone: {config: ASSISTANT_BACKEND_JVM_TIME_ZONE, default: Asia/Ho_Chi_Minh, description: "Múi giờ của JVM backend; dùng cho trường time_zone: BACKEND_JVM."}
    display_time_zone: Asia/Ho_Chi_Minh
    values:
      UTC: "Service ghi bằng LocalDateTime.now(clock) hoặc LocalDateTime.ofInstant(clock.instant(), UTC); clock là Clock.systemUTC() (SecurityConfig.clock). Lớp lọc đổi UTC sang giờ Việt Nam."
      BACKEND_JVM: "createdAt, updatedAt (@CreationTimestamp, @UpdateTimestamp trong BaseEntity), occurredAt (lấy từ createdAt) và signedAt (ContractTimeProvider.now()): theo múi giờ JVM backend. Lớp lọc đổi từ backend_jvm_time_zone sang giờ Việt Nam (không đổi gì khi hai múi giờ trùng nhau)."
      NOT_WRITTEN: "Code hiện chưa ghi trường này (luôn rỗng); lớp lọc không đổi múi giờ."
    rules:
      - "Định dạng hiển thị dd/MM/yyyy HH:mm, giờ Việt Nam."
      - "Ngày lịch (LocalDate: hạn đóng học phí, ngày học, ngày bắt đầu, kết thúc hợp đồng) và giờ học (LocalTime) giữ nguyên, không đổi múi giờ."
      - "Tham số thời gian model điền (createdFrom, createdTo) so với createdAt (BACKEND_JVM); model điền theo giờ Việt Nam, lớp lọc đổi sang backend_jvm_time_zone trước khi gọi API."
    team_followup: "Việc riêng cho nhóm: thống nhất múi giờ toàn hệ thống (UTC ở backend, frontend tự đổi). Xem docs/support-chatbot/trien-khai/NHAT-KY-CLAUDE.md mục Múi giờ."
  derived_fields: "Trường có derived: true không có trong API; lớp lọc kết quả tự tính theo derived_from trước khi đưa model. Mã người hỏi lấy từ header X-User-Id mà backend gửi sang assistant-service (07-api.md mục 7.4); model không thấy mã này."
  paging_defaults: "page mặc định 0 (nhỏ nhất 0); size mặc định 20, từ 1 đến 100. Với công cụ liệt kê có phân trang, lớp lọc cố định size = 100 (fixed_params) để tính tổng và đếm theo trạng thái, rồi chỉ đưa model max_items mục."
  list_rules:
    description: "Áp cho mọi công cụ có max_items. Lớp lọc chọn mục theo result_selection.strategy, cắt còn max_items, và luôn kèm tổng số cùng số lượng theo trường count_by."
    output_shape: '{"total": 12, "counts": {"PENDING": 3, "PAID": 9}, "items": [... tối đa max_items mục]}'
    total: "Với API phân trang: data.totalElements. Với API trả danh sách: số phần tử của danh sách."
    counts: "Đếm theo count_by trên các mục đã lấy về (tối đa 100 với API phân trang); khi totalElements > 100 thì ghi rõ counts chỉ tính trên 100 mục mới nhất."
    strategies:
      newest: "Giữ max_items mục đầu theo thứ tự API trả (các API này đã sắp mới nhất trước)."
      api_order: "Giữ max_items mục đầu theo thứ tự API trả; muốn chọn nhóm mục nào thì model dùng bộ lọc của chính API (không tự lọc trong lớp lọc)."
      installments_due_first: "Kỳ chưa đóng (PENDING) trước, xếp theo dueDate tăng dần, kỳ chưa có dueDate xếp cuối nhóm; còn chỗ thì thêm kỳ đã đóng (PAID) có dueDate gần nhất trước; cuối cùng là kỳ đã hủy."
      lessons_pending_first: "Mọi buổi PENDING_CONFIRMATION trước (dù vượt max_items vẫn giữ đủ nhóm này); tiếp theo các buổi SCHEDULED gần nhất (date, startTime tăng dần); còn chỗ thì các buổi đã qua gần nhất (CONFIRMED, COMPLETED, CANCELLED; date giảm dần)."

# Lỗi chung có thể gặp ở mọi công cụ.
common_errors:
  - {code: UNAUTHORIZED, http: 401, meaning: Phiên đăng nhập hết hạn hoặc thiếu; làm mới phiên rồi gọi lại một lần, source: SecurityConfig authenticationEntryPoint}
  - {code: INVALID_AUTHENTICATED_USER, http: 401, meaning: Tài khoản trong phiên không còn tồn tại, source: security/AccountStatusFilter}
  - {code: FORBIDDEN, http: 403, meaning: Vai trò của người hỏi không được gọi API này; không thử công cụ khác để vòng qua, source: SecurityConfig accessDeniedHandler}
  - {code: ACCOUNT_SUSPENDED, http: 403, meaning: Tài khoản đang bị khóa nên không tra cứu được, source: security/AccountStatusFilter}
  - {code: ACCOUNT_INACTIVE, http: 403, meaning: Tài khoản đang ngừng hoạt động, source: security/AccountStatusFilter}
  - {code: VALIDATION_ERROR, http: 400, meaning: "Tham số ngoài giới hạn, ví dụ page âm hoặc size ngoài 1–100", source: exception/GlobalExceptionHandler}
  - {code: INVALID_REQUEST, http: 400, meaning: "Tham số sai kiểu, ví dụ mã không phải UUID hoặc giá trị lọc không thuộc danh sách enum", source: exception/GlobalExceptionHandler}
  - {code: RESOURCE_NOT_FOUND, http: 404, meaning: "Đường dẫn không tồn tại (thường gặp ở công cụ planned khi backend chưa có API)", source: exception/GlobalExceptionHandler}
  - {code: INTERNAL_SERVER_ERROR, http: 500, meaning: Lỗi máy chủ; báo tạm thời chưa tra cứu được, source: exception/GlobalExceptionHandler}

# Endpoint đã cân nhắc nhưng không đưa vào danh mục.
excluded_endpoints:
  - {method: GET, path: /api/v1/users/me/bank-account, reason: "Dữ liệu nhạy cảm (số tài khoản ngân hàng, tên chủ tài khoản)"}
  - {method: GET, path: /api/v1/payments/vnpay/ipn, reason: "Callback máy chủ–máy chủ của VNPay, không phải dữ liệu của người hỏi"}
  - {method: GET, path: /api/v1/payments/vnpay/return, reason: "Trang VNPay chuyển hướng về sau thanh toán, không phải dữ liệu của người hỏi"}
  - {method: GET, path: "/api/v1/studying-requests, /api/v1/studying-requests/{studyingRequestId}", reason: "Gia sư tìm tin tìm gia sư đang mở; không phải dữ liệu 'của tôi' (quyết định ngày 2026-11-03: không thêm)"}
  - {method: GET, path: "/api/v1/tutors/{tutorId}, /api/v1/tutors/{tutorId}/certificates", reason: "Hồ sơ, chứng chỉ công khai của gia sư bất kỳ; không phải 'của tôi' và có tham số định danh người dùng"}
  - {method: GET, path: "/api/v1/teaching-requests, /api/v1/teaching-requests/{requestId}", reason: "Tin nhận dạy công khai; không phải dữ liệu 'của tôi'"}
  - {method: GET, path: "/api/v1/reviews, /api/v1/subjects, /api/v1/grades, /api/v1/provinces, /api/v1/districts", reason: "Dữ liệu công khai hoặc danh mục; không phải dữ liệu 'của tôi'"}
  - {method: "POST, PUT, PATCH, DELETE", path: "mọi đường dẫn", reason: "Ghi dữ liệu; trợ lý không được thao tác thay người dùng (đặc tả 5.1 ý 1, QĐ7)"}

x-shared:
  paging:
    page: &p_page {name: page, in: query, type: int, default: 0, min: 0, description: "Số trang, bắt đầu từ 0. Chỉ tăng khi người dùng muốn xem thêm mục cũ hơn."}
    size: &p_size {name: size, in: query, type: int, default: 20, min: 1, max: 100, description: Số mục mỗi trang. Để mặc định.}
  enums:
    contract_status: &enum_contract_status
      type: Enum
      keep: true
      description: Trạng thái hợp đồng
      enum_labels:
        PENDING: {label: Đang chờ, meaning: "Đã soạn, đang chờ bên nhận ký; người soạn còn sửa hoặc hủy được"}
        ACTIVE: {label: Đang hoạt động, meaning: "Đã ký, đang có hiệu lực; học viên đóng học phí theo các kỳ"}
        COMPLETED: {label: Đã hoàn tất, meaning: Đã tới ngày kết thúc khi đang hoạt động}
        CANCELLED: {label: Đã hủy, meaning: "Người soạn hủy, bên nhận từ chối, hoặc tới ngày kết thúc mà chưa ký"}
    teaching_mode: &enum_teaching_mode
      type: Enum
      keep: true
      description: Hình thức dạy
      enum_labels:
        ONLINE: {label: Trực tuyến, meaning: Học qua mạng}
        OFFLINE: {label: Trực tiếp, meaning: Học tại địa điểm hai bên thống nhất}
    learning_mode: &enum_learning_mode
      type: Enum
      keep: true
      description: Hình thức học
      enum_labels:
        ONLINE: {label: Trực tuyến, meaning: Học qua mạng}
        OFFLINE: {label: Trực tiếp, meaning: Học tại địa điểm hai bên thống nhất}
    payment_period: &enum_payment_period
      type: Enum
      keep: true
      description: Chu kỳ thanh toán
      enum_labels:
        PER_LESSON: {label: Mỗi buổi, meaning: "Mỗi buổi gia sư tạo sinh một kỳ học phí, hạn đóng là ngày học"}
        WEEKLY: {label: Hàng tuần, meaning: "Mỗi tuần một kỳ, từ ngày bắt đầu tới trước ngày kết thúc"}
        MONTHLY: {label: Hàng tháng, meaning: "Mỗi tháng một kỳ, từ ngày bắt đầu tới trước ngày kết thúc"}
        PACKAGE: {label: Theo gói, meaning: "Một kỳ duy nhất, hạn đóng là ngày bắt đầu"}
    request_status: &enum_request_status
      type: Enum
      keep: true
      description: Trạng thái tin đăng
      enum_labels:
        DRAFT: {label: Bản nháp, meaning: "Đã tạo nhưng chưa trả phí đăng tin, chưa ai thấy"}
        PENDING_REVIEW: {label: Chờ duyệt, meaning: "Đã trả phí, chờ nhân viên chăm sóc khách hàng duyệt (môn tự nhập hoặc có ghi chú)"}
        OPEN: {label: Đang mở, meaning: "Đã đăng; bên kia thấy tin và gửi đề nghị hoặc đơn đăng ký"}
        MATCHED: {label: Đã ghép, meaning: "Tin tìm gia sư đã chấp nhận một gia sư, hoặc tin nhận dạy đã đủ học viên; bước tiếp theo là hợp đồng"}
        CLOSED: {label: Tạm đóng, meaning: "Người đăng tạm đóng; không nhận đề nghị mới, mở lại được"}
        CANCELLED: {label: Đã hủy, meaning: Người đăng đã hủy tin}
        REJECTED: {label: Bị từ chối, meaning: "Không được duyệt; phí đăng tin đã hoàn vào ví"}
    application_status: &enum_application_status
      type: Enum
      keep: true
      description: Trạng thái đề nghị dạy hoặc đơn đăng ký học
      enum_labels:
        PENDING: {label: Đang chờ, meaning: Bên kia chưa trả lời; người gửi còn hủy được}
        ACCEPTED: {label: Đã chấp nhận, meaning: Bên kia đồng ý; bước tiếp theo là tạo hợp đồng}
        REJECTED: {label: Đã từ chối, meaning: Bên kia từ chối}
        CANCELLED: {label: Đã hủy, meaning: "Người gửi tự hủy, hoặc học viên đã hủy tin tìm gia sư"}
    next_step: &enum_next_step
      type: String
      keep: true
      description: "Bước tiếp theo; rỗng khi chưa được chấp nhận"
      enum_labels:
        CONTRACT_SIGNING: {label: Tạo và ký hợp đồng, meaning: Đề nghị hoặc đơn đã được chấp nhận; hai bên tạo và ký hợp đồng}
    lesson_status: &enum_lesson_status
      type: Enum
      keep: true
      description: Trạng thái buổi học
      enum_labels:
        SCHEDULED: {label: Sắp diễn ra, meaning: Đã lên lịch và chưa tới giờ kết thúc}
        PENDING_CONFIRMATION: {label: Chờ xác nhận, meaning: "Gia sư đã đánh dấu đã dạy; học viên xác nhận hoặc yêu cầu hoàn tiền trong 3 ngày"}
        CONFIRMED: {label: Đã học, meaning: Học viên đã xác nhận buổi học}
        COMPLETED: {label: Đã học, meaning: "Tự hoàn tất sau 3 ngày, hoặc kế toán kết luận gia sư đã dạy"}
        CANCELLED: {label: Đã huỷ, meaning: "Gia sư hủy, hoặc kết luận vắng trong yêu cầu hoàn tiền"}
    installment_status: &enum_installment_status
      type: Enum
      keep: true
      description: Tình trạng của kỳ học phí
      enum_labels:
        PENDING: {label: Đang chờ, meaning: Kỳ chưa được thanh toán}
        PAID: {label: Đã thanh toán, meaning: Kỳ đã thanh toán xong}
        CANCELLED: {label: Đã hủy, meaning: Kỳ không còn phải đóng}
    complaint_status: &enum_complaint_status
      type: Enum
      keep: true
      description: Trạng thái khiếu nại
      enum_labels:
        PENDING: {label: Chờ tiếp nhận, meaning: "Chưa có nhân viên nhận xử lý; người gửi còn sửa, hủy được"}
        IN_REVIEW: {label: Đang xử lý, meaning: Nhân viên chăm sóc khách hàng đang xử lý; bên bị khiếu nại được phản hồi một lần}
        AWAITING_EVIDENCE: {label: Chờ bằng chứng, meaning: Đang chờ người khiếu nại bổ sung 1–5 bằng chứng}
        RESOLVED: {label: Đã giải quyết, meaning: Khiếu nại được chấp nhận, có ghi bên có lỗi}
        REJECTED: {label: Đã từ chối, meaning: Khiếu nại không được chấp nhận}
        CANCELLED: {label: Đã huỷ, meaning: Người gửi hủy khi còn chờ tiếp nhận}
    complaint_category: &enum_complaint_category
      type: Enum
      keep: true
      description: Loại khiếu nại
      enum_labels:
        ABSENCE: {label: Vắng mặt, meaning: Một bên không có mặt ở buổi học}
        LATE_OR_SHORT: {label: Muộn / thiếu giờ, meaning: Tới muộn hoặc dạy, học không đủ giờ}
        TEACHING_QUALITY: {label: Chất lượng giảng dạy, meaning: Phản ánh về chất lượng dạy}
        MISCONDUCT: {label: Vi phạm ứng xử, meaning: Hành vi không phù hợp}
        SERIOUS_MISCONDUCT: {label: Vi phạm nghiêm trọng, meaning: Hành vi vi phạm nghiêm trọng}
        OTHER: {label: Khác, meaning: Vấn đề khác}
    fault_party: &enum_fault_party
      type: Enum
      keep: true
      description: "Bên có lỗi theo kết luận; chỉ có khi khiếu nại được chấp nhận"
      enum_labels:
        RESPONDENT: {label: Bên bị khiếu nại, meaning: Bên bị khiếu nại có lỗi}
        COMPLAINANT: {label: Bên khiếu nại, meaning: Người gửi khiếu nại có lỗi}
        BOTH: {label: Cả hai bên, meaning: Cả hai bên đều có lỗi}
        NONE: {label: Không bên nào, meaning: Không bên nào có lỗi}
    refund_status: &enum_refund_status
      type: Enum
      keep: true
      description: Trạng thái yêu cầu hoàn tiền
      enum_labels:
        PENDING: {label: Chờ tiếp nhận, meaning: "Học viên vừa gửi, chưa có kế toán nhận xử lý; gia sư phản hồi trong 48 giờ; học viên còn hủy được"}
        IN_REVIEW: {label: Đang xử lý, meaning: "Kế toán đã tiếp nhận; gia sư vẫn phản hồi được nếu còn hạn và chưa phản hồi"}
        REFUNDED: {label: Đã hoàn tiền, meaning: "Kế toán đã kết luận và hoàn tiền vào ví học viên; phần của gia sư (nếu có) đã vào ví gia sư"}
        REJECTED: {label: Đã từ chối, meaning: "Kế toán từ chối yêu cầu, có ghi lý do"}
        CANCELLED: {label: Đã huỷ, meaning: Học viên tự hủy khi còn chờ tiếp nhận}
    lesson_outcome: &enum_lesson_outcome
      type: Enum
      keep: true
      description: Kết quả của một buổi bị phản đối
      enum_labels:
        TAUGHT: {label: Đã dạy, meaning: Buổi học đã diễn ra}
        TUTOR_ABSENT: {label: Gia sư không dạy, meaning: "Gia sư vắng; nếu được kết luận, học viên được hoàn 100% đơn giá buổi"}
        STUDENT_ABSENT: {label: Học viên nghỉ, meaning: "Học viên nghỉ; nếu được kết luận, học viên được hoàn 80% đơn giá, gia sư nhận 20%"}
    gender: &enum_gender
      type: Enum
      keep: false
      reason: Dữ liệu cá nhân không cần cho câu trả lời
      description: Giới tính
      enum_labels:
