  schemas:
    contract: &schema_contract
      id: {type: UUID, description: "Mã hợp đồng; dùng cho get_my_contract, list_my_payment_installments, list_contract_lessons_for_student, list_contract_lessons_for_tutor", keep: true, seen_id: true}
      studentId: {type: UUID, description: Mã hồ sơ học viên, keep: false, reason: Mã nội bộ không cần cho câu trả lời}
      studentFirstName: {type: String, description: Tên gọi của học viên, keep: true}
      studentLastName: {type: String, description: Họ của học viên, keep: false, reason: "Dữ liệu cá nhân; chỉ giữ tên gọi"}
      studentEmail: {type: String, description: Email học viên, keep: false, reason: Dữ liệu liên hệ cá nhân}
      tutorId: {type: UUID, description: Mã hồ sơ gia sư, keep: false, reason: Mã nội bộ không cần cho câu trả lời}
      tutorFirstName: {type: String, description: Tên gọi của gia sư, keep: true}
      tutorLastName: {type: String, description: Họ của gia sư, keep: false, reason: "Dữ liệu cá nhân; chỉ giữ tên gọi"}
      tutorEmail: {type: String, description: Email gia sư, keep: false, reason: Dữ liệu liên hệ cá nhân}
      subjectId: {type: UUID, description: Mã môn học, keep: false, reason: Mã nội bộ; đã có subjectName}
      subjectName: {type: String, description: Tên môn học, keep: true}
      gradeId: {type: UUID, description: Mã lớp, keep: false, reason: Mã nội bộ; đã có gradeName}
      gradeName: {type: String, description: "Tên lớp; có thể rỗng", keep: true}
      teachingMode: *enum_teaching_mode
      price: {type: BigDecimal, description: "Giá của mỗi kỳ thanh toán (mỗi buổi, mỗi tuần, mỗi tháng hoặc cả gói), đơn vị đồng", keep: true}
      paymentPeriod: *enum_payment_period
      totalLessons: {type: Integer, description: Tổng số buổi của hợp đồng, keep: true}
      preferredSchedule: {type: String, description: "Lịch học dạng chữ (hệ thống ghép từ các khung giờ, hoặc chữ nhập ở hợp đồng cũ)", keep: true, user_text: true}
      schedules:
        type: List<Schedule>
        keep: true
        description: Các khung giờ học trong tuần
        items:
          dayOfWeek: {type: Integer, description: "Thứ trong tuần: 1 = Thứ Hai … 6 = Thứ Bảy, 7 = Chủ nhật", keep: true}
          startTime: {type: LocalTime, description: Giờ bắt đầu, keep: true}
          endTime: {type: LocalTime, description: Giờ kết thúc, keep: true}
      startDate: {type: LocalDate, description: Ngày bắt đầu, keep: true}
      endDate: {type: LocalDate, description: "Ngày kết thúc; lúc 0 giờ ngày này hợp đồng đang hoạt động chuyển sang Đã hoàn tất, hợp đồng chưa ký chuyển sang Đã hủy", keep: true}
      status: *enum_contract_status
      createdByUserId: {type: UUID, description: Mã tài khoản người soạn hợp đồng, keep: false, reason: "Mã tài khoản nội bộ; lớp lọc dùng để tính createdByMe rồi bỏ"}
      signedByUserId: {type: UUID, description: "Mã tài khoản người ký; rỗng khi chưa ký", keep: false, reason: "Mã tài khoản nội bộ; trạng thái và signedAt đã đủ cho câu trả lời"}
      createdByMe: {type: Boolean, derived: true, derived_from: "createdByUserId == X-User-Id", description: "true nếu người hỏi là người soạn hợp đồng (được sửa, hủy khi Đang chờ); false nếu là bên nhận (được ký hoặc từ chối). Chỉ để giải thích; backend vẫn tự kiểm tra quyền khi người dùng bấm nút", keep: true}
      tutorStudentRequestId: {type: UUID, description: "Mã đề nghị dạy tạo ra hợp đồng (khi học viên soạn); có thể rỗng", keep: false, reason: "Mã nội bộ; không đủ để gọi get_offer_for_my_request vì thiếu mã tin"}
      studentTutorRequestId: {type: UUID, description: "Mã đơn đăng ký học tạo ra hợp đồng (khi gia sư soạn); có thể rỗng", keep: false, reason: Mã nội bộ không cần cho câu trả lời}
