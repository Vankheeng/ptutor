openapi: 3.0.3
info:
  title: PTutor API
  version: 1.0.0
  description: API documentation for the PTutor tutoring platform.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Authentication
    description: Registration and authentication operations
  - name: Password Reset
    description: Email OTP operations for resetting a forgotten password
  - name: Student Profile
    description: Operations for the authenticated student's own profile
  - name: Account
    description: Operations for the authenticated user's own account
  - name: Tutor Profiles
    description: Public tutor profile operations available to authenticated users
  - name: Tutor Certificates
    description: Certificate management for the authenticated tutor
  - name: Teaching Requests
    description: Tutor teaching-request management and authenticated request browsing
  - name: Subjects
    description: Active subject catalog used by teaching requests
  - name: Grades
    description: Active grade catalog used by teaching requests
  - name: Districts
    description: District catalog used by profile and teaching-request forms
  - name: Complaints
    description: Complaint submission, evidence management and complaint processing
security:
  - bearerAuth: []
paths:
  /api/v1/complaints:
    post:
      tags: [Complaints]
      summary: Submit a complaint
      description: A student or tutor submits a complaint for one of their contracts. Evidence URLs may be included in the same request.
      operationId: createComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201':
          description: Complaint submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      tags: [Complaints]
      summary: List my complaints
      operationId: listMyComplaints
      responses:
        '200':
          description: Complaints submitted by the authenticated student or tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/complaints/{complaintId}:
    get:
      tags: [Complaints]
      summary: Get one of my complaints
      operationId: getMyComplaint
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Complaint details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/complaints/{complaintId}/evidences:
    post:
      tags: [Complaints]
      summary: Add evidence to my complaint
      operationId: addComplaintEvidence
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintEvidenceRequest'
      responses:
        '201':
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintEvidenceResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/complaints/{complaintId}/evidences/{evidenceId}:
    delete:
      tags: [Complaints]
      summary: Delete evidence from my complaint
      operationId: deleteComplaintEvidence
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Evidence deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDeleteResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/admin/complaints:
    get:
      tags: [Complaints]
      summary: List complaints for processing
      operationId: listComplaintsForManagement
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, IN_REVIEW, RESOLVED, REJECTED]
      responses:
        '200':
          description: Complaints ordered from newest to oldest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/admin/complaints/{complaintId}:
    get:
      tags: [Complaints]
      summary: Get a complaint for processing
      operationId: getComplaintForManagement
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Complaint details including evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/complaints/{complaintId}/status:
    patch:
      tags: [Complaints]
      summary: Process a complaint
      description: IN_REVIEW represents requesting more evidence or continuing investigation. RESOLVED and REJECTED require a resolution message.
      operationId: processComplaint
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintResolutionRequest'
      responses:
        '200':
          description: Complaint status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a student or tutor account
      description: Creates a user account and its student or tutor profile. Employee and admin registration is not allowed.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: student01@example.com
              password: Password123
              role: STUDENT
              firstName: Nguyen
              lastName: An
              phone: '0900000000'
              gender: MALE
              dateOfBirth: '2005-01-01'
              citizenId: '012345678901'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
      responses:
        '201':
          description: Account registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticates a student, tutor, employee or admin using email and password.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: student01@example.com
              password: Password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access and refresh tokens
      description: Rotates a valid opaque refresh token. An access JWT is not required for this endpoint.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: paste-refresh-token-here
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Revokes the supplied refresh token. The operation is idempotent and does not require an access JWT.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: paste-refresh-token-here
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password-reset/otp:
    post:
      tags: [Password Reset]
      summary: Send a password reset OTP
      description: Invalidates previous unused OTPs and sends a new six-digit OTP to the registered email. The OTP expires after five minutes.
      operationId: sendPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPasswordResetOtpRequest'
            example:
              email: student01@example.com
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/EmailNotFoundError'
        '503':
          $ref: '#/components/responses/EmailDeliveryError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password-reset/verify:
    post:
      tags: [Password Reset]
      summary: Verify a password reset OTP
      description: Checks the latest OTP for the email without consuming it or extending its expiry time.
      operationId: verifyPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordResetOtpRequest'
            example:
              email: student01@example.com
              otp: '123456'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifiedResponseEnvelope'
        '400':
          $ref: '#/components/responses/InvalidOtpError'
        '404':
          $ref: '#/components/responses/EmailNotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/password-reset/reset:
    post:
      tags: [Password Reset]
      summary: Reset a forgotten password
      description: Revalidates and atomically consumes the OTP, then stores the new password as a BCrypt hash. Existing sessions remain valid.
      operationId: resetForgottenPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              email: student01@example.com
              otp: '123456'
              newPassword: NewPassword456
              confirmNewPassword: NewPassword456
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponseEnvelope'
        '400':
          $ref: '#/components/responses/InvalidOtpError'
        '404':
          $ref: '#/components/responses/EmailNotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me:
    get:
      tags:
        - Student Profile
      summary: Get the authenticated student's profile
      description: Returns the profile associated with the user ID from the access JWT. Only students can call this endpoint.
      operationId: getCurrentStudentProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Student Profile
      summary: Partially update the authenticated student's profile
      description: Updates only non-null fields. Province and district IDs must be supplied together. Email and sensitive fields cannot be updated.
      operationId: updateCurrentStudentProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
            example:
              firstName: Nguyen Van
              phone: '0912345678'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              detailAddress: 123 Example Street
              introduction: I am preparing for university entrance exams.
      responses:
        '200':
          description: Student profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/password:
    put:
      tags:
        - Account
      summary: Change the authenticated user's password
      description: Changes the password for the user identified by the access JWT. Existing access and refresh tokens remain valid.
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: Password123
              newPassword: NewPassword456
              confirmNewPassword: NewPassword456
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tutors/me:
    get:
      tags:
        - Tutor Profiles
      summary: Get my tutor profile
      description: Returns the authenticated tutor's own profile, including personal contact and address information.
      operationId: getMyTutorProfile
      responses:
        '200':
          description: Tutor profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorSelfProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Tutor Profiles
      summary: Partially update my tutor profile
      description: Updates the authenticated tutor's personal, address and professional profile fields. Null fields are left unchanged. Email, password, citizen ID, account status, ratings and statistics cannot be updated.
      operationId: updateMyTutorProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTutorProfileRequest'
            example:
              firstName: Nguyen Van
              phone: '0912345678'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              detailAddress: 123 Example Street
              introduction: Experienced English tutor
              experienceYears: 5
              education: Bachelor of English
              teachingStyleTags: Patient, practical
              teachingMethodology: Communicative learning
              strengthSubjects: English, IELTS
              targetStudentType: High school students
      responses:
        '200':
          description: Tutor profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorSelfProfileResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tutors/{tutorId}:
    parameters:
      - $ref: '#/components/parameters/TutorId'
    get:
      tags:
        - Tutor Profiles
      summary: Get a tutor profile
      description: Returns the public profile of a tutor. This endpoint is available to all authenticated users.
      operationId: getTutorProfile
      responses:
        '200':
          description: Tutor profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tutors/me/teaching-requests:
    post:
      tags:
        - Teaching Requests
      summary: Create a teaching request
      description: Creates a DRAFT request until payment is confirmed. After payment, an existing subject is activated as OPEN and a custom subject is sent to PENDING_REVIEW.
      operationId: createMyTeachingRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingRequestRequest'
            example:
              subjectId: 1f8f8a2a-29e4-4f65-a5d5-2a2c9fdc6c3c
              gradeIds:
                - 4e5f8a08-41fb-4f14-85f7-01c9cfb5a2b0
              title: Math tutor for secondary students
              note: Looking for students in the evening
              quantity: 3
              districtIds:
                - 20b7f1d4-9a6d-4c4d-98cb-4c8c30a752f2
              detailAddress: District 1
              expectedPrice: 150000
              teachingMode: OFFLINE
              preferredSchedule: Weekday evenings
              description: I am available for one-to-one or small-group tutoring.
              availabilities:
                - dayOfWeek: 2
                  startTime: '18:00:00'
                  endTime: '20:00:00'
      responses:
        '201':
          description: Teaching request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      tags:
        - Teaching Requests
      summary: List my teaching requests
      description: Returns all teaching requests created by the authenticated tutor. An optional status filter can be supplied.
      operationId: listMyTeachingRequests
      parameters:
        - $ref: '#/components/parameters/TeachingRequestStatus'
      responses:
        '200':
          description: Teaching requests belonging to the authenticated tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestListResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/tutors/me/teaching-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    get:
      tags:
        - Teaching Requests
      summary: Get one of my teaching requests
      operationId: getMyTeachingRequest
      responses:
        '200':
          description: Teaching request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Teaching Requests
      summary: Update one of my teaching requests
      description: Updates a DRAFT, OPEN or PENDING_REVIEW request. A DRAFT remains hidden and stays DRAFT until payment. For an already activated request, changing from an existing subject to a custom subject sends it back to PENDING_REVIEW.
      operationId: updateMyTeachingRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingRequestRequest'
      responses:
        '200':
          description: Teaching request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/tutors/me/teaching-requests/{requestId}/status:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    patch:
      tags:
        - Teaching Requests
      summary: Update teaching request status
      description: Tutors can only switch an existing OPEN request to CLOSED or a CLOSED request back to OPEN.
      operationId: updateMyTeachingRequestStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingRequestStatusRequest'
            example:
              status: CLOSED
      responses:
        '200':
          description: Teaching request status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/tutors/me/teaching-requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    post:
      tags:
        - Teaching Requests
      summary: Cancel one of my teaching requests
      description: Cancels a DRAFT, OPEN, CLOSED or PENDING_REVIEW request by changing its status to CANCELLED.
      operationId: cancelMyTeachingRequest
      responses:
        '200':
          description: Teaching request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/subjects:
    get:
      tags:
        - Subjects
      summary: Get all active subjects
      description: Returns the active subjects available when creating or updating a teaching request.
      operationId: listActiveSubjects
      responses:
        '200':
          description: Active subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/grades:
    get:
      tags:
        - Grades
      summary: Get all active grades
      description: Returns active grades ordered from grade 1 to grade 12 for teaching-request forms.
      operationId: listActiveGrades
      responses:
        '200':
          description: Active grades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/teaching-requests:
    get:
      tags:
        - Teaching Requests
      summary: Browse teaching requests
      description: Students and tutors see only OPEN requests. Employees and admins see all requests and statuses.
      operationId: listVisibleTeachingRequests
      responses:
        '200':
          description: Visible teaching requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/teaching-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/TeachingRequestId'
    get:
      tags:
        - Teaching Requests
      summary: Get a visible teaching request
      description: Students and tutors can view OPEN requests. Employees and admins can view requests in every status.
      operationId: getVisibleTeachingRequest
      responses:
        '200':
          description: Teaching request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequestResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/districts:
    get:
      tags:
        - Districts
      summary: Get districts
      description: Returns all districts ordered by province and district name. Use provinceId to filter districts belonging to one province.
      operationId: listDistricts
      parameters:
        - name: provinceId
          in: query
          required: false
          description: Optional province identifier used to filter the result.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Districts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictListResponseEnvelope'
        '400':
          description: The provinceId is invalid or does not identify an existing province
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/tutors/me/certificates:
    post:
      tags:
        - Tutor Certificates
      summary: Upload a certificate record
      description: Creates a certificate record for the authenticated tutor. New certificates are always created with PENDING status.
      operationId: createMyCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRequest'
            example:
              name: IELTS 8.0
              issuingOrganization: British Council
              description: English language certificate
              issueDate: '2025-05-20'
              expiryDate: '2027-05-20'
              certificateUrl: https://cdn.example.com/certificates/ielts.pdf
      responses:
        '201':
          description: Certificate created and queued for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    get:
      tags:
        - Tutor Certificates
      summary: List my certificates
      description: Returns all certificates when status is omitted, or certificates with the requested status.
      operationId: listMyCertificates
      parameters:
        - name: status
          in: query
          required: false
          description: Optional certificate status filter.
          schema:
            type: string
            enum:
              - PENDING
              - VERIFIED
              - REJECTED
              - EXPIRED
      responses:
        '200':
          description: Certificates belonging to the authenticated tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/tutors/{tutorId}/certificates:
    parameters:
      - $ref: '#/components/parameters/TutorId'
    get:
      tags:
        - Tutor Certificates
      summary: List a tutor's verified certificates
      description: Returns only VERIFIED certificates and is available to authenticated students.
      operationId: listTutorVerifiedCertificates
      responses:
        '200':
          description: Verified certificates belonging to the requested tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/tutors/me/certificates/{certificateId}:
    parameters:
      - $ref: '#/components/parameters/CertificateId'
    get:
      tags:
        - Tutor Certificates
      summary: Get one of my certificates
      operationId: getMyCertificate
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Tutor Certificates
      summary: Update one of my certificates
      description: Updating a pending or rejected certificate sends it back to PENDING. Verified certificates cannot be edited.
      operationId: updateMyCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRequest'
      responses:
        '200':
          description: Certificate updated and queued for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      tags:
        - Tutor Certificates
      summary: Delete one of my certificates
      operationId: deleteMyCertificate
      responses:
        '200':
          description: Certificate deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateDeleteResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeachingRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeachingRequestStatus:
      name: status
      in: query
      required: false
      description: Optional teaching-request status filter.
      schema:
        type: string
        enum:
          - DRAFT
          - PENDING_REVIEW
          - OPEN
          - MATCHED
          - CLOSED
          - CANCELLED
          - REJECTED
    TutorId:
      name: tutorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ComplaintId:
      name: complaintId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
        - firstName
        - lastName
        - phone
        - gender
        - dateOfBirth
        - citizenId
        - provinceId
        - districtId
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date
        citizenId:
          type: string
          pattern: '^\d{12}$'
          example: '012345678901'
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1

    SendPasswordResetOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255

    VerifyPasswordResetOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        otp:
          type: string
          pattern: '^\\d{6}$'
          example: '123456'

    ResetPasswordRequest:
      type: object
      required: [email, otp, newPassword, confirmNewPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        otp:
          type: string
          pattern: '^\\d{6}$'
          example: '123456'
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        confirmNewPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    OtpVerificationResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          example: true

    UpdateStudentProfileRequest:
      type: object
      description: At least one property must contain a non-null value.
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
          format: date
        avatarUrl:
          type: string
          maxLength: 500
        detailAddress:
          type: string
          maxLength: 255
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid
        introduction:
          type: string
        learningStyle:
          type: string
          maxLength: 50
        personalityTags:
          type: string
          maxLength: 255
        goalsDescription:
          type: string
        currentLevel:
          type: string
          maxLength: 50
        weakPoints:
          type: string

    UpdateTutorProfileRequest:
      type: object
      description: All fields are optional. Null fields are left unchanged. Province and district IDs must be supplied together.
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
          format: date
        avatarUrl:
          type: string
          maxLength: 500
        detailAddress:
          type: string
          maxLength: 255
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid
        introduction:
          type: string
        experienceYears:
          type: integer
          minimum: 0
        education:
          type: string
        teachingStyleTags:
          type: string
          maxLength: 255
        teachingMethodology:
          type: string
        strengthSubjects:
          type: string
        targetStudentType:
          type: string
          maxLength: 255

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmNewPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        confirmNewPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    CertificateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        issuingOrganization:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
          description: Must be on or after issueDate when both dates are provided.
        certificateUrl:
          type: string
          maxLength: 500

    ComplaintEvidenceRequest:
      type: object
      required: [fileUrl, fileType]
      properties:
        fileUrl:
          type: string
          maxLength: 500
        fileType:
          type: string
          maxLength: 100

    CreateComplaintRequest:
      type: object
      required: [contractId, title, content]
      properties:
        contractId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
        content:
          type: string
          maxLength: 10000
        evidences:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ComplaintEvidenceRequest'

    ComplaintResolutionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [IN_REVIEW, RESOLVED, REJECTED]
        resolution:
          type: string
          maxLength: 10000
          description: Required for RESOLVED and REJECTED.

    ComplaintEvidenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fileUrl:
          type: string
        fileType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ComplaintResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [PENDING, IN_REVIEW, RESOLVED, REJECTED]
        resolution:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        evidences:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintEvidenceResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeachingRequestAvailabilityRequest:
      type: object
      required:
        - dayOfWeek
        - startTime
        - endTime
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    TeachingRequestRequest:
      type: object
      description: Provide exactly one of subjectId or customSubjectName.
      required:
        - gradeIds
        - title
        - quantity
        - expectedPrice
        - teachingMode
      properties:
        subjectId:
          type: string
          format: uuid
          nullable: true
        customSubjectName:
          type: string
          maxLength: 100
          nullable: true
          description: A subject not yet available in the catalog. Requests using this field require review.
        gradeIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        title:
          type: string
          maxLength: 255
        note:
          type: string
          maxLength: 255
          nullable: true
        quantity:
          type: integer
          minimum: 1
        districtIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        detailAddress:
          type: string
          maxLength: 255
          nullable: true
        expectedPrice:
          type: number
          format: double
          minimum: 0
        teachingMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          maxLength: 500
          nullable: true
        description:
          type: string
          maxLength: 10000
          nullable: true
        availabilities:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TeachingRequestAvailabilityRequest'

    TeachingRequestStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED]

    TeachingRequestAvailabilityResponse:
      type: object
      properties:
        dayOfWeek:
          type: integer
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    TeachingRequestReferenceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    TeachingRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tutorId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        subjectName:
          type: string
          nullable: true
        customSubjectName:
          type: string
          nullable: true
        grades:
          type: array
          items:
            $ref: '#/components/schemas/TeachingRequestReferenceResponse'
        districts:
          type: array
          items:
            $ref: '#/components/schemas/TeachingRequestReferenceResponse'
        title:
          type: string
        note:
          type: string
          nullable: true
        quantity:
          type: integer
        detailAddress:
          type: string
          nullable: true
        expectedPrice:
          type: number
          format: double
        teachingMode:
          type: string
          enum: [OFFLINE, ONLINE]
        preferredSchedule:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        availabilities:
          type: array
          items:
            $ref: '#/components/schemas/TeachingRequestAvailabilityResponse'
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, OPEN, MATCHED, CLOSED, CANCELLED, REJECTED]
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TutorProfileResponse:
      type: object
      properties:
        tutorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        introduction:
          type: string
          nullable: true
        experienceYears:
          type: integer
          nullable: true
        education:
          type: string
          nullable: true
        teachingStyleTags:
          type: string
          nullable: true
        teachingMethodology:
          type: string
          nullable: true
        strengthSubjects:
          type: string
          nullable: true
        targetStudentType:
          type: string
          nullable: true
        averageRating:
          type: number
          format: double
        totalReviews:
          type: integer
        completedContractsCount:
          type: integer
        totalStudentsTaught:
          type: integer
        acceptanceRate:
          type: number
          format: double
          nullable: true
        avgResponseTimeHours:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TutorSelfProfileResponse:
      allOf:
        - $ref: '#/components/schemas/TutorProfileResponse'
        - type: object
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
              nullable: true
            gender:
              type: string
              nullable: true
              enum: [MALE, FEMALE, OTHER]
            dateOfBirth:
              type: string
              format: date
              nullable: true
            address:
              $ref: '#/components/schemas/AddressResponse'

    CertificateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tutorId:
          type: string
          format: uuid
        name:
          type: string
        issuingOrganization:
          type: string
        description:
          type: string
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        certificateUrl:
          type: string
        status:
          type: string
          readOnly: true
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
            - EXPIRED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GradeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Lớp 1
        level:
          type: integer
          example: 1
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DistrictResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ba Đình
        provinceId:
          type: string
          format: uuid
        provinceName:
          type: string
          example: Hà Nội
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
            - EMPLOYEE
            - ADMIN

    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        accessTokenExpiresIn:
          type: integer
          format: int64
          example: 3600
        refreshTokenExpiresIn:
          type: integer
          format: int64
          example: 2592000
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
            - EMPLOYEE
            - ADMIN

    AddressResponse:
      type: object
      properties:
        detailAddress:
          type: string
          nullable: true
        districtId:
          type: string
          format: uuid
          nullable: true
        districtName:
          type: string
          nullable: true
        provinceId:
          type: string
          format: uuid
          nullable: true
        provinceName:
          type: string
          nullable: true

    StudentProfileResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/AddressResponse'
        introduction:
          type: string
          nullable: true
        learningStyle:
          type: string
          nullable: true
        personalityTags:
          type: string
          nullable: true
        goalsDescription:
          type: string
          nullable: true
        currentLevel:
          type: string
          nullable: true
        weakPoints:
          type: string
          nullable: true

    ApiResponseMetadata:
      type: object
      required:
