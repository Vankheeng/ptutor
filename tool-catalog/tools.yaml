      id: {type: UUID, description: "Mã chứng chỉ; dùng cho get_my_certificate", keep: true, seen_id: true}
      tutorId: {type: UUID, description: Mã hồ sơ gia sư, keep: false, reason: Mã nội bộ}
      name: {type: String, description: Tên chứng chỉ, keep: true, user_text: true}
      issuingOrganization: {type: String, description: "Đơn vị cấp; có thể rỗng", keep: true, user_text: true}
      description: {type: String, description: "Mô tả; có thể rỗng", keep: true, user_text: true}
      issueDate: {type: LocalDate, description: "Ngày cấp; có thể rỗng", keep: true}
      expiryDate: {type: LocalDate, description: "Ngày hết hạn; rỗng nếu không có thời hạn. Chứng chỉ quá hạn không được duyệt", keep: true}
      certificateUrl: {type: String, description: "Đường dẫn xem tệp chứng chỉ (link tạm có hạn 15 phút)", keep: false, reason: "Link tạm tới tệp cá nhân; model không mở được"}
      status: *enum_certificate_status
      rejectionReason: {type: String, description: "Lý do từ chối; rỗng nếu không bị từ chối", keep: true, user_text: true}
      reviewedAt: {type: LocalDateTime, time_zone: UTC, description: "Thời điểm duyệt hoặc từ chối; rỗng khi chưa duyệt", keep: true}
      createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm nộp, keep: true}
      updatedAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm cập nhật gần nhất, keep: false, reason: Không cần cho câu trả lời}

    wallet_transaction: &schema_wallet_transaction
      transactionId: {type: UUID, description: "Mã giao dịch ví; dùng cho get_my_wallet_transaction", keep: true, seen_id: true}
      walletId: {type: UUID, description: Mã ví, keep: false, reason: Mã nội bộ}
      transactionType: *enum_wallet_tx_type
      purpose: *enum_wallet_tx_purpose
      amount: {type: BigDecimal, description: Số tiền giao dịch, đơn vị đồng, keep: true}
      balanceAfter: {type: BigDecimal, description: Số dư dùng được sau giao dịch, keep: true}
      pendingBalanceAfter: {type: BigDecimal, description: Số tiền đang tạm giữ sau giao dịch, keep: true}
      referenceType: *enum_reference_type
      referenceId: {type: UUID, description: "Mã đối tượng liên quan (hợp đồng, thanh toán, yêu cầu rút, yêu cầu hoàn tiền…), theo referenceType", keep: true, seen_id: true}
      description: {type: String, description: "Mô tả giao dịch do hệ thống ghi, tiếng Anh (ví dụ Wallet top-up via VNPay)", keep: true}
      status: *enum_wallet_tx_status
      createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm giao dịch, keep: true}
      updatedAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm cập nhật gần nhất, keep: false, reason: Không cần cho câu trả lời}

    address: &schema_address
      detailAddress: {type: String, description: Địa chỉ chi tiết, keep: false, reason: Địa chỉ chi tiết là dữ liệu cá nhân}
      districtId: {type: UUID, description: Mã quận/huyện, keep: false, reason: Mã nội bộ}
      districtName: {type: String, description: Quận/huyện, keep: true}
      provinceId: {type: UUID, description: Mã tỉnh/thành, keep: false, reason: Mã nội bộ}
      provinceName: {type: String, description: Tỉnh/thành, keep: true}

tools:
  # ===================== Dùng chung STUDENT, TUTOR =====================
  - func_code: list_my_contracts
    name: Liệt kê hợp đồng của tôi
    status: ready
    roles: [STUDENT, TUTOR]
    features: [contract]
    reversibility: READ_ONLY
    description: >
      Trả về danh sách hợp đồng mà người hỏi là học viên hoặc gia sư, mới tạo trước, kèm trạng thái, môn, lớp, giá,
      chu kỳ thanh toán, thời gian, tên gọi của bên kia và người hỏi có phải người soạn không. Dùng khi người dùng hỏi
      chung về các hợp đồng của mình, đếm hợp đồng, hoặc cần mã hợp đồng cho công cụ khác. Không dùng khi đã biết đúng
      một hợp đồng và cần chi tiết (dùng get_my_contract), không dùng để hỏi quy định ký, hủy, gia hạn (trả lời bằng tài liệu).
    example_questions:
      - Tôi đang có những hợp đồng nào?
      - hop dong nao cua toi dang cho ky
      - Có bao nhiêu hợp đồng đã hoàn tất rồi?
      - Còn hợp đồng với cô giáo dạy Tiếng Anh thì sao, đang ở trạng thái gì?
    negative_examples:
      - Hủy hợp đồng đang học được không?
      - Lịch học cụ thể của hợp đồng môn Toán là thứ mấy?
    request: {method: GET, path: /api/v1/users/me/contracts}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [PENDING, ACTIVE, COMPLETED, CANCELLED], default: null, description: "Chỉ điền khi người dùng hỏi theo trạng thái (đang chờ ký, đang học, đã xong, đã hủy). Để trống để lấy mọi hợp đồng."}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/users/me/contracts?status=ACTIVE&page=0&size=20"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: ContractResponse, schema: *schema_contract}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa có hợp đồng nào khớp điều kiện này.
    errors:
      - {code: INVALID_REQUEST, http: 400, meaning: Giá trị status không thuộc danh sách trạng thái hợp đồng}
      - {code: VALIDATION_ERROR, http: 400, meaning: "page âm hoặc size ngoài 1–100"}
    source:
      - controller: ContractController.findMine (GET /api/v1/users/me/contracts)
      - service: ContractService.findMine -> ContractRepository.findAllForParticipant
      - mapper: ContractMapper.toResponse
      - dto: ContractResponse, ContractResponse.Schedule, PageResponse
      - enum: ContractStatus, TeachingMode, PaymentPeriod
      - security: "SecurityConstants.CONTRACT_SELF_SERVICE_API hasAnyRole(STUDENT, TUTOR)"
      - labels: "frontend components/student/StudentContractStatusBadge.tsx, StudentContractOverview.tsx"

  - func_code: get_my_contract
    name: Xem chi tiết một hợp đồng
    status: ready
    roles: [STUDENT, TUTOR]
    features: [contract]
    reversibility: READ_ONLY
    description: >
      Trả về đầy đủ một hợp đồng của người hỏi: trạng thái, lịch học từng khung giờ, giá, chu kỳ thanh toán, ngày bắt đầu,
      ngày kết thúc, thời điểm ký, tên gọi bên kia, có phải hợp đồng gia hạn không. Dùng khi người dùng hỏi về một hợp đồng
      cụ thể đã xuất hiện trong hội thoại, hoặc để lấy tên gọi bên kia từ contractId của yêu cầu hoàn tiền, khiếu nại.
      Không dùng để liệt kê, đếm hợp đồng (dùng list_my_contracts) hay xem kỳ học phí, buổi học (dùng công cụ tương ứng).
    example_questions:
      - Hợp đồng môn Toán của tôi học vào những thứ nào?
      - hop dong do ket thuc ngay nao
      - Hợp đồng vừa rồi đã được ký chưa, ký lúc nào?
      - Hợp đồng đó tôi có được hủy không, tôi là người soạn à?
    negative_examples:
      - Tôi có mấy hợp đồng đang hoạt động?
      - Kỳ học phí tiếp theo của hợp đồng này bao nhiêu tiền?
    request: {method: GET, path: "/api/v1/users/me/contracts/{contractId}"}
    required_params:
      - name: contractId
        in: path
        type: UUID
        source: seen_ids
        from_tools: [list_my_contracts, get_my_contract, list_my_refund_requests, get_my_refund_request, list_refund_requests_on_my_contracts, get_refund_request_on_my_contract, list_my_complaints, get_my_complaint, list_complaints_against_me, get_complaint_against_me, list_contract_lessons_for_student, list_contract_lessons_for_tutor, get_my_lesson]
        description: Mã hợp đồng người dùng đang nói tới. Chưa có mã thì gọi list_my_contracts trước.
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/contracts/3f2c8a51-7d1e-4c55-9a0b-2b7e6f1d40e1"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: ContractResponse, schema: *schema_contract}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    side_effects: >
      Đọc, có tác dụng phụ lặp lại vô hại: khi hợp đồng đang hoạt động mà chưa có kỳ học phí, máy chủ tạo các kỳ học phí
      trong lúc gọi API này (ContractPaymentInstallmentService.ensureForActiveContract). Việc tạo chỉ xảy ra một lần; đã có kỳ
      thì không tạo nữa. Màn hình hợp đồng của người dùng và tác vụ nhắc học phí lúc 9 giờ hằng ngày cũng gọi đúng hàm này.
    errors:
      - {code: CONTRACT_NOT_FOUND, http: 404, meaning: Không tìm thấy hợp đồng này trong các hợp đồng của bạn}
      - {code: INVALID_CONTRACT_PAYMENT_AMOUNT, http: 409, meaning: "Hợp đồng đang hoạt động có giá bằng 0 nên máy chủ không tạo được kỳ học phí", user_message: "Hợp đồng này đang có giá bằng 0 nên hệ thống chưa tạo được các kỳ học phí và chưa hiển thị được chi tiết. Bạn liên hệ PTutor để được kiểm tra lại giá hợp đồng."}
      - {code: INVALID_REQUEST, http: 400, meaning: contractId không phải UUID}
    source:
      - controller: ContractController.findMineById (GET /api/v1/users/me/contracts/{contractId})
      - service: ContractService.findMineById, findContractForParticipant -> ContractRepository.findDetailedByIdAndParticipantUserId
      - service: ContractPaymentInstallmentService.ensureForActiveContract
      - mapper: ContractMapper.toResponse
      - dto: ContractResponse
      - security: "SecurityConstants.CONTRACT_SELF_SERVICE_API hasAnyRole(STUDENT, TUTOR)"

  - func_code: get_my_wallet
    name: Xem số dư ví
    status: ready
    roles: [STUDENT, TUTOR]
    features: [wallet]
    reversibility: READ_ONLY
    description: >
      Trả về số dư ví hiện tại của người hỏi: số dư dùng được và số tiền đang tạm giữ cho yêu cầu rút. Dùng khi người dùng
      hỏi ví còn bao nhiêu tiền, có đủ tiền không, vì sao số dư bị giữ. Không dùng để xem lịch sử nạp, trừ tiền (dùng
      list_my_wallet_transactions) và không dùng để hỏi quy định nạp ví (trả lời bằng tài liệu).
    example_questions:
      - Ví của tôi còn bao nhiêu tiền?
      - so du vi hien tai
      - Có khoản nào đang bị tạm giữ trong ví không?
    negative_examples:
      - Nạp ví tối thiểu bao nhiêu?
      - Tháng này tôi đã nạp những lần nào?
    request: {method: GET, path: /api/v1/users/me/wallet}
    required_params: []
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/wallet"}
    response:
      wrapper: ApiResponse.data (một đối tượng)
      item_class: WalletBalanceResponse
      schema:
        walletId: {type: UUID, description: Mã ví, keep: false, reason: Mã nội bộ}
        userId: {type: UUID, description: Mã tài khoản, keep: false, reason: Mã tài khoản nội bộ}
        balance: {type: BigDecimal, description: Số dư dùng được, đơn vị đồng, keep: true}
        pendingBalance: {type: BigDecimal, description: "Số tiền đang tạm giữ cho yêu cầu rút chưa xử lý, đơn vị đồng", keep: true}
        currency: {type: String, description: Đơn vị tiền (VND), keep: true}
        updatedAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm số dư thay đổi gần nhất, keep: false, reason: Không cần cho câu trả lời}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: WALLET_NOT_FOUND, http: 404, meaning: Tài khoản chưa có ví; báo lỗi hệ thống và gợi ý liên hệ PTutor}
    source:
      - controller: WalletController.getCurrentBalance (GET /api/v1/users/me/wallet)
      - service: WalletService.getCurrentBalance
      - dto: WalletBalanceResponse
      - security: "SecurityConstants.WALLET_SELF_SERVICE_API hasAnyRole(STUDENT, TUTOR)"

  - func_code: list_my_wallet_transactions
    name: Liệt kê giao dịch ví
    status: ready
    roles: [STUDENT, TUTOR]
    features: [wallet]
    reversibility: READ_ONLY
    description: >
      Trả về các bút toán cộng, trừ trong ví của người hỏi, mới nhất trước: số tiền, mục đích (nạp ví, hoàn tiền, phí,
      học phí, rút tiền…), trạng thái, số dư sau giao dịch. Dùng khi người dùng hỏi tiền vào, ra khỏi ví, tiền hoàn đã
      vào ví chưa. Không dùng để xem lần thanh toán VNPay (không qua ví), dùng list_my_transactions; không dùng để xem số dư
      hiện tại (dùng get_my_wallet).
    example_questions:
      - Tiền hoàn học phí đã vào ví tôi chưa?
      - lich su giao dich vi
      - Tuần trước ví tôi bị trừ những khoản gì?
      - Khoản cộng tiền gần nhất là tiền gì vậy?
    negative_examples:
      - Lần thanh toán VNPay hôm qua thành công chưa?
      - Ví còn bao nhiêu tiền?
    request: {method: GET, path: /api/v1/users/me/wallet/transactions}
    required_params: []
    optional_params:
      - {name: transactionType, in: query, type: Enum, enum: [CREDIT, DEBIT], default: null, description: "Điền CREDIT khi hỏi tiền vào, DEBIT khi hỏi tiền ra; để trống để lấy cả hai."}
      - {name: purpose, in: query, type: Enum, enum: [TOP_UP, TUTOR_EARNING, CONTRACT_REFUND, TEACHING_REQUEST_REFUND, STUDYING_REQUEST_REFUND, WITHDRAWAL_REVERSAL, TUITION_PAYMENT, STUDYING_REQUEST_FEE, TEACHING_REQUEST_FEE, WITHDRAWAL], default: null, description: "Chỉ điền khi người dùng hỏi đúng một loại (ví dụ CONTRACT_REFUND khi hỏi tiền hoàn học phí)."}
      - {name: status, in: query, type: Enum, enum: [PENDING, COMPLETED, FAILED, CANCELLED], default: null, description: Thường để trống.}
      - {name: createdFrom, in: query, type: LocalDateTime, format: "ISO-8601, ví dụ 2026-11-01T00:00:00", default: null, description: "Điền khi người dùng nêu khoảng thời gian; tính theo múi giờ máy chủ."}
      - {name: createdTo, in: query, type: LocalDateTime, format: "ISO-8601", default: null, description: "Cuối khoảng thời gian; phải không sớm hơn createdFrom."}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần, rồi id (cố định trong service)"
    example_call: {url: "{{base_url}}/api/v1/users/me/wallet/transactions?purpose=CONTRACT_REFUND&page=0&size=20"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: WalletTransactionResponse, schema: *schema_wallet_transaction}
    max_items: 10
    result_selection: {strategy: newest, count_by: transactionType}
    allow_empty_result: true
    empty_result_message: Ví của bạn chưa có giao dịch nào khớp điều kiện này.
    errors:
      - {code: INVALID_TRANSACTION_DATE_RANGE, http: 400, meaning: createdFrom sau createdTo}
      - {code: INVALID_REQUEST, http: 400, meaning: "Giá trị lọc không thuộc danh sách, hoặc thời gian sai định dạng"}
    source:
      - controller: WalletController.getTransactions (GET /api/v1/users/me/wallet/transactions)
      - service: WalletService.getMyTransactions
      - dto: WalletTransactionResponse
      - enum: WalletTransactionType, WalletTransactionPurpose, WalletTransactionStatus, ReferenceType
      - labels: "frontend pages/admin/studentFormat.ts (Cộng ví, Trừ ví); còn lại tự đặt"

  - func_code: get_my_wallet_transaction
    name: Xem một giao dịch ví
    status: ready
    roles: [STUDENT, TUTOR]
    features: [wallet]
    reversibility: READ_ONLY
    description: >
      Trả về một bút toán ví cụ thể: số tiền, mục đích, trạng thái, số dư sau giao dịch và đối tượng liên quan. Dùng khi
      người dùng hỏi kỹ về một giao dịch ví đã xuất hiện trong hội thoại. Không dùng để liệt kê giao dịch (dùng
      list_my_wallet_transactions) và không dùng cho lần thanh toán VNPay (dùng get_my_payment).
    example_questions:
      - Giao dịch trừ 200.000đ đó là khoản gì?
      - giao dich vua roi da hoan tat chua
      - Khoản đó liên quan tới hợp đồng nào?
    negative_examples:
      - Liệt kê các giao dịch ví tháng này.
    request: {method: GET, path: "/api/v1/users/me/wallet/transactions/{transactionId}"}
    required_params:
      - {name: transactionId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_wallet_transactions], description: Mã giao dịch ví. Chưa có thì gọi list_my_wallet_transactions trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/wallet/transactions/6a0e2b7c-1d4f-4a3e-9f21-7c5b8d2e4a10"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: WalletTransactionResponse, schema: *schema_wallet_transaction}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: WALLET_TRANSACTION_NOT_FOUND, http: 404, meaning: Không tìm thấy giao dịch này trong ví của bạn}
      - {code: INVALID_REQUEST, http: 400, meaning: transactionId không phải UUID}
    source:
      - controller: WalletController.getTransaction (GET /api/v1/users/me/wallet/transactions/{transactionId})
      - service: WalletService.getMyTransaction
      - dto: WalletTransactionResponse

  - func_code: list_my_transactions
    name: Liệt kê các lần thanh toán
    status: ready
    roles: [STUDENT, TUTOR]
    features: [payment]
    reversibility: READ_ONLY
    description: >
      Trả về các lần thanh toán của người hỏi, mới nhất trước: nạp ví, học phí, phí đăng tin; phương thức VNPay hoặc ví;
      trạng thái thành công, thất bại, đang chờ. Dùng khi người dùng hỏi đã thanh toán những gì, lần thanh toán VNPay gần
      nhất thành công chưa. Không dùng cho bút toán cộng, trừ ví (dùng list_my_wallet_transactions), yêu cầu rút tiền (dùng
      list_my_withdrawals) hay kỳ học phí của một hợp đồng (dùng list_my_payment_installments).
    example_questions:
      - Tôi đã thanh toán những khoản nào?
      - lan thanh toan vnpay gan nhat thanh cong chua
      - Có khoản thanh toán nào bị thất bại không?
      - Khoản phí đăng tin tôi trả hôm trước đi theo cách nào?
    negative_examples:
      - Kỳ học phí tiếp theo của hợp đồng Toán là bao nhiêu?
      - Thanh toán VNPay có mất phí không?
    request: {method: GET, path: /api/v1/users/me/transactions}
    required_params: []
    optional_params:
      - {name: status, in: query, type: String, enum: [PENDING, PAID, FAILED, CANCELLED, REFUNDED], default: null, description: "So khớp không phân biệt hoa thường; ví dụ FAILED khi hỏi thanh toán thất bại."}
      - {name: type, in: query, type: String, enum: [WALLET_TOP_UP, TUITION_PAYMENT, STUDYING_REQUEST_FEE, TEACHING_REQUEST_FEE], default: null, description: "Loại khoản; ví dụ TUITION_PAYMENT khi hỏi học phí, WALLET_TOP_UP khi hỏi nạp ví."}
      - {name: method, in: query, type: String, enum: [VNPAY, WALLET], default: null, description: "VNPAY khi hỏi riêng thanh toán VNPay."}
      - *p_page
    fixed_params: {source: PAYMENT, size: 100}
    fixed_params_reason: "API gộp ba nguồn (thanh toán, giao dịch ví, rút tiền; PaymentService.findMyTransactions) nên mỗi lần trả bằng ví, nạp ví hay rút tiền hiện hai dòng. Cố định source=PAYMENT để công cụ chỉ đọc một nguồn; giao dịch ví và rút tiền đã có công cụ riêng. Model không đổi được."
    sort: "occurredAt giảm dần (sắp trong service sau khi gộp)"
    example_call: {url: "{{base_url}}/api/v1/users/me/transactions?source=PAYMENT&method=VNPAY&page=0&size=100"}
    response:
      wrapper: ApiResponse.data.content (phân trang)
      item_class: FinancialTransactionResponse
      schema:
        id: {type: UUID, description: "Mã thanh toán; dùng cho get_my_payment", keep: true, seen_id: true}
        source:
          <<: *enum_financial_source
          keep: false
          reason: "Luôn là PAYMENT vì source được cố định"
        type:
          type: String
          keep: true
          description: "Loại khoản thanh toán (tên PaymentType)"
          enum_labels:
            WALLET_TOP_UP: {label: Nạp ví, meaning: Nạp tiền vào ví}
            TUITION_PAYMENT: {label: Học phí, meaning: Đóng kỳ học phí}
            STUDYING_REQUEST_FEE: {label: Phí đăng yêu cầu học, meaning: Phí đăng tin tìm gia sư}
            TEACHING_REQUEST_FEE: {label: Phí đăng tin dạy, meaning: Phí đăng tin nhận dạy}
        method:
          type: String
          keep: true
          description: Phương thức
          enum_labels:
            VNPAY: {label: VNPay, meaning: Thanh toán qua VNPay}
            WALLET: {label: Ví, meaning: Qua ví PTutor}
        status:
          type: String
          keep: true
          description: "Trạng thái thanh toán (tên PaymentStatus)"
          enum_labels:
            PENDING: {label: Đang chờ, meaning: "Đã tạo link VNPay nhưng chưa có kết quả; link hiệu lực 15 phút"}
            PAID: {label: Đã thanh toán, meaning: Thanh toán thành công}
            FAILED: {label: Thất bại, meaning: "Hủy trên VNPay, ngân hàng từ chối, hoặc link quá 15 phút"}
            CANCELLED: {label: Đã huỷ, meaning: Link VNPay bị bỏ vì khoản đó đã được trả bằng ví}
            REFUNDED: {label: Đã hoàn, meaning: Khoản học phí đã được hoàn lại toàn bộ vào ví}
        amount: {type: BigDecimal, description: Số tiền, đơn vị đồng, keep: true}
        referenceId: {type: UUID, description: "Mã đối tượng được thanh toán: hợp đồng (học phí), tin tìm gia sư hoặc tin nhận dạy (phí đăng tin); rỗng với nạp ví", keep: true, seen_id: true}
        description: {type: String, description: "Ghi chú của lần thanh toán do hệ thống ghi", keep: true, user_text: true}
        occurredAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm phát sinh, keep: true}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa có giao dịch tài chính nào khớp điều kiện này.
    errors:
    source:
      - controller: PaymentController.transactions (GET /api/v1/users/me/transactions)
      - service: PaymentService.findMyTransactions, toFinancialPayment, toFinancialWalletTransaction, toFinancialWithdrawal
      - dto: FinancialTransactionResponse
      - enum: FinancialTransactionSource
      - security: "SecurityConstants.PAYMENT_SELF_SERVICE_API hasAnyRole(STUDENT, TUTOR)"
      - labels: "frontend pages/admin/studentFormat.ts (transactionSourceLabels, transactionTypeLabels, transactionMethodLabels, transactionStatusMeta)"

  - func_code: get_my_payment
    name: Xem một lần thanh toán
    status: ready
    roles: [STUDENT, TUTOR]
    features: [payment]
    reversibility: READ_ONLY
    description: >
      Trả về một lần thanh toán cụ thể: loại khoản, phương thức (VNPay hoặc ví), trạng thái, số tiền, hạn của link VNPay,
      thời điểm thanh toán thành công. Dùng khi người dùng hỏi lần thanh toán đã xuất hiện trong hội thoại thành công chưa,
      vì sao thất bại. Không dùng để liệt kê thanh toán (dùng list_my_transactions) hay xem giao dịch ví (dùng
      get_my_wallet_transaction).
    example_questions:
      - Lần thanh toán học phí vừa rồi đã thành công chưa?
      - thanh toan do het han chua
      - Khoản đó trả bằng VNPay hay bằng ví?
    negative_examples:
      - Link VNPay có hiệu lực bao lâu?
    request: {method: GET, path: "/api/v1/users/me/payments/{paymentId}"}
    required_params:
      - {name: paymentId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_transactions, list_my_wallet_transactions], description: "Mã thanh toán: id trong list_my_transactions, hoặc referenceId của giao dịch ví có referenceType = PAYMENT. Chưa có thì gọi list_my_transactions trước."}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/payments/1c7e9a20-5b3d-4f8e-a6c2-0d9f3b1e7a55"}
    response:
      wrapper: ApiResponse.data (một đối tượng)
      item_class: PaymentResponse
      schema:
        id: {type: UUID, description: Mã thanh toán, keep: true, seen_id: true}
        paymentType: *enum_payment_type
        paymentMethod: *enum_payment_method
        status: *enum_payment_status
        amount: {type: BigDecimal, description: Số tiền, đơn vị đồng, keep: true}
        referenceType: *enum_reference_type
        referenceId: {type: UUID, description: "Mã đối tượng được thanh toán (hợp đồng, tin tìm gia sư, tin nhận dạy) theo referenceType", keep: true, seen_id: true}
        paymentInstallmentId: {type: UUID, description: "Mã kỳ học phí (với thanh toán học phí)", keep: false, reason: "Mã nội bộ; kỳ học phí xem bằng list_my_payment_installments"}
        transactionCode: {type: String, description: Mã giao dịch PTutor gửi sang VNPay, keep: false, reason: Mã giao dịch của cổng thanh toán}
        providerTransactionNo: {type: String, description: Mã giao dịch phía VNPay, keep: false, reason: Mã giao dịch của cổng thanh toán}
        expiresAt: {type: LocalDateTime, time_zone: UTC, description: "Hạn của link VNPay (15 phút sau khi tạo); rỗng với thanh toán bằng ví", keep: true}
        paidAt: {type: LocalDateTime, time_zone: UTC, description: "Thời điểm thanh toán thành công; rỗng khi chưa thành công", keep: true}
        createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm tạo lần thanh toán, keep: true}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: PAYMENT_NOT_FOUND, http: 404, meaning: Không tìm thấy lần thanh toán này trong tài khoản của bạn}
      - {code: INVALID_REQUEST, http: 400, meaning: paymentId không phải UUID}
    source:
      - controller: PaymentController.findPayment (GET /api/v1/users/me/payments/{paymentId})
      - service: PaymentService.findMine, toPaymentResponse
      - dto: PaymentResponse
      - enum: PaymentType, PaymentMethod, PaymentStatus, ReferenceType
      - labels: "frontend pages/admin/complaintFormat.ts (paymentStatusMeta, paymentMethodLabels), studentFormat.ts"

  - func_code: list_my_withdrawals
    name: Liệt kê yêu cầu rút tiền
    status: ready
    roles: [STUDENT, TUTOR]
    features: [withdrawal]
    reversibility: READ_ONLY
    description: >
      Trả về các yêu cầu rút tiền của người hỏi, mới nhất trước: số tiền, trạng thái, lý do từ chối nếu có. Dùng khi người
      dùng hỏi yêu cầu rút tiền tới đâu rồi, đã chuyển tiền chưa. Không dùng để hỏi quy định rút tiền (trả lời bằng tài
      liệu) và không dùng để xem số tiền đang tạm giữ tổng (dùng get_my_wallet).
    example_questions:
      - Yêu cầu rút tiền của tôi tới đâu rồi?
      - rut tien da duoc chuyen chua
      - Cái yêu cầu rút 500.000đ đó có hủy được không?
    negative_examples:
      - Rút tiền mất bao lâu?
    request: {method: GET, path: /api/v1/users/me/wallet/withdrawals}
    required_params: []
    optional_params:
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần, rồi id (cố định trong service)"
    example_call: {url: "{{base_url}}/api/v1/users/me/wallet/withdrawals?page=0&size=20"}
    response:
      wrapper: ApiResponse.data.content (phân trang)
      item_class: WithdrawalResponse
      schema:
        withdrawalId: {type: UUID, description: Mã yêu cầu rút, keep: true}
        walletId: {type: UUID, description: Mã ví, keep: false, reason: Mã nội bộ}
        amount: {type: BigDecimal, description: Số tiền rút, đơn vị đồng, keep: true}
        bankCode: {type: String, description: Mã ngân hàng nhận, keep: false, reason: Thông tin tài khoản ngân hàng}
        bankName: {type: String, description: Tên ngân hàng nhận, keep: false, reason: Thông tin tài khoản ngân hàng}
        maskedAccountNumber: {type: String, description: Số tài khoản đã che, keep: false, reason: Số tài khoản ngân hàng (dù đã che)}
        accountHolderName: {type: String, description: Tên chủ tài khoản, keep: false, reason: Họ tên đầy đủ trên tài khoản ngân hàng}
        note: {type: String, description: Ghi chú của người dùng, keep: true, user_text: true}
        status: *enum_withdrawal_status
        reviewedByUserId: {type: UUID, description: Mã tài khoản người xử lý, keep: false, reason: Mã tài khoản nội bộ}
        reviewedAt: {type: LocalDateTime, time_zone: NOT_WRITTEN, description: "Thời điểm xử lý (hệ thống hiện chưa ghi)", keep: true}
        rejectionReason: {type: String, description: "Lý do từ chối (hệ thống hiện chưa ghi)", keep: true, user_text: true}
        completedAt: {type: LocalDateTime, time_zone: NOT_WRITTEN, description: "Thời điểm chuyển tiền xong (hệ thống hiện chưa ghi)", keep: true}
        transferReference: {type: String, description: Mã giao dịch chuyển khoản, keep: false, reason: Mã giao dịch ngân hàng}
        createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm gửi yêu cầu, keep: true}
        updatedAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm cập nhật gần nhất, keep: false, reason: Không cần cho câu trả lời}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa gửi yêu cầu rút tiền nào.
    errors:
      - {code: VALIDATION_ERROR, http: 400, meaning: "page âm hoặc size ngoài 1–100"}
    source:
      - controller: WithdrawalController.findMine (GET /api/v1/users/me/wallet/withdrawals)
      - service: WithdrawalService.findMine
      - dto: WithdrawalResponse
      - enum: WithdrawalRequestStatus
      - security: "SecurityConstants.WALLET_SELF_SERVICE_API hasAnyRole(STUDENT, TUTOR)"

  - func_code: list_my_complaints
    name: Liệt kê khiếu nại tôi đã gửi
    status: ready
    roles: [STUDENT, TUTOR]
    features: [complaint]
    reversibility: READ_ONLY
    description: >
      Trả về các khiếu nại người hỏi đã gửi, mới nhất trước: tiêu đề, loại, trạng thái, kết luận. Dùng khi người dùng hỏi
      khiếu nại của mình đã được xử lý chưa, có cần bổ sung bằng chứng không. Không dùng cho khiếu nại người khác gửi về
      mình (dùng list_complaints_against_me) và không dùng để hỏi quy trình khiếu nại (trả lời bằng tài liệu).
    example_questions:
      - Khiếu nại của tôi đã được xử lý chưa?
      - khieu nai cua toi dang o buoc nao
      - Có khiếu nại nào đang chờ tôi bổ sung bằng chứng không?
    negative_examples:
      - Có ai khiếu nại tôi không?
      - Khiếu nại mất bao lâu để giải quyết?
    request: {method: GET, path: /api/v1/users/me/complaints}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [PENDING, IN_REVIEW, AWAITING_EVIDENCE, RESOLVED, REJECTED, CANCELLED], default: null, description: "Chỉ điền khi người dùng hỏi theo trạng thái, ví dụ AWAITING_EVIDENCE khi hỏi cần bổ sung bằng chứng."}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/users/me/complaints?status=AWAITING_EVIDENCE&page=0&size=20"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: ComplaintResponse, schema: *schema_complaint}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa gửi khiếu nại nào khớp điều kiện này.
    errors:
      - {code: INVALID_REQUEST, http: 400, meaning: Giá trị status không thuộc danh sách}
    source:
      - controller: ComplaintController.findMine (GET /api/v1/users/me/complaints)
      - service: ComplaintService.findMine
      - mapper: ComplaintMapper (qua ComplaintService.toResponses)
      - dto: ComplaintResponse, ComplaintResponse.Evidence
      - enum: ComplaintStatus, ComplaintCategory, ComplaintFaultParty
      - security: "SecurityConstants.COMPLAINT_SELF_SERVICE_API hasAnyRole(STUDENT, TUTOR)"
      - labels: "frontend pages/admin/complaintFormat.ts (trang người dùng chưa có)"

  - func_code: get_my_complaint
    name: Xem một khiếu nại tôi đã gửi
    status: ready
    roles: [STUDENT, TUTOR]
    features: [complaint]
    reversibility: READ_ONLY
    description: >
      Trả về đầy đủ một khiếu nại người hỏi đã gửi: nội dung, trạng thái, lời yêu cầu bổ sung hoặc kết luận, bên có lỗi,
      phản hồi của bên bị khiếu nại. Dùng khi người dùng hỏi kỹ về một khiếu nại đã xuất hiện trong hội thoại, ví dụ vì
      sao phải bổ sung bằng chứng. Không dùng để liệt kê (dùng list_my_complaints) và không dùng cho khiếu nại về mình
      (dùng get_complaint_against_me).
    example_questions:
      - Vì sao khiếu nại của tôi cần bổ sung bằng chứng?
      - khieu nai do ket luan ben nao co loi
      - Bên kia đã phản hồi khiếu nại đó chưa?
    negative_examples:
      - Có bao nhiêu khiếu nại tôi đã gửi?
    request: {method: GET, path: "/api/v1/users/me/complaints/{complaintId}"}
    required_params:
      - {name: complaintId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_complaints], description: Mã khiếu nại người dùng đã gửi. Chưa có thì gọi list_my_complaints trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/complaints/4d2a7e10-9c3b-4f61-8e5a-1b7c0d9e2f33"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: ComplaintResponse, schema: *schema_complaint}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: COMPLAINT_NOT_FOUND, http: 404, meaning: Không tìm thấy khiếu nại này trong các khiếu nại bạn đã gửi}
      - {code: INVALID_REQUEST, http: 400, meaning: complaintId không phải UUID}
    source:
      - controller: ComplaintController.findMineById (GET /api/v1/users/me/complaints/{complaintId})
      - service: ComplaintService.findMineById
      - dto: ComplaintResponse

  - func_code: list_complaints_against_me
    name: Liệt kê khiếu nại về tôi
    status: ready
    roles: [STUDENT, TUTOR]
    features: [complaint]
    reversibility: READ_ONLY
    description: >
      Trả về các khiếu nại bên kia của hợp đồng gửi về người hỏi, chỉ từ khi nhân viên đã tiếp nhận: tiêu đề, loại, trạng
      thái, người hỏi đã phản hồi chưa. Dùng khi người dùng hỏi có ai khiếu nại mình không, mình đã phản hồi chưa. Không
      dùng cho khiếu nại do chính người hỏi gửi (dùng list_my_complaints). Khiếu nại còn chờ tiếp nhận hoặc đã bị hủy không
      hiện ở đây.
    example_questions:
      - Có ai khiếu nại tôi không?
      - khieu nai ve toi da ket luan chua
      - Khiếu nại đó tôi đã phản hồi chưa?
    negative_examples:
      - Khiếu nại tôi gửi tuần trước sao rồi?
    request: {method: GET, path: /api/v1/users/me/complaints/against-me}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [IN_REVIEW, AWAITING_EVIDENCE, RESOLVED, REJECTED], default: null, description: "Chỉ điền khi người dùng hỏi theo trạng thái. PENDING hoặc CANCELLED luôn trả rỗng."}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/users/me/complaints/against-me?page=0&size=20"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: ComplaintResponse, schema: *schema_complaint}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Hiện không có khiếu nại nào về bạn đang được xử lý hoặc đã có kết luận.
    errors:
      - {code: INVALID_REQUEST, http: 400, meaning: Giá trị status không thuộc danh sách}
    source:
      - controller: ComplaintController.findAgainstMe (GET /api/v1/users/me/complaints/against-me)
      - service: ComplaintService.findAgainstMe, forRespondent (ẩn resolution khi chưa có kết luận)
      - dto: ComplaintResponse

  - func_code: get_complaint_against_me
    name: Xem một khiếu nại về tôi
    status: ready
    roles: [STUDENT, TUTOR]
    features: [complaint]
    reversibility: READ_ONLY
    description: >
      Trả về đầy đủ một khiếu nại về người hỏi: nội dung, loại, trạng thái, phản hồi người hỏi đã gửi, kết luận và bên có
      lỗi khi đã kết luận. Dùng khi người dùng hỏi kỹ về một khiếu nại về mình đã xuất hiện trong hội thoại. Không dùng để
      liệt kê (dùng list_complaints_against_me) và không dùng cho khiếu nại do người hỏi gửi (dùng get_my_complaint).
    example_questions:
      - Học viên khiếu nại tôi về chuyện gì?
      - khieu nai do ket luan the nao
      - Tôi còn phản hồi được khiếu nại đó không?
    negative_examples:
      - Bị kết luận có lỗi thì bị phạt thế nào?
    request: {method: GET, path: "/api/v1/users/me/complaints/against-me/{complaintId}"}
    required_params:
      - {name: complaintId, in: path, type: UUID, source: seen_ids, from_tools: [list_complaints_against_me], description: Mã khiếu nại về người dùng. Chưa có thì gọi list_complaints_against_me trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/complaints/against-me/8b3f1c55-2e7a-4d90-b6c4-3a1e9f0d7c21"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: ComplaintResponse, schema: *schema_complaint}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: COMPLAINT_NOT_FOUND, http: 404, meaning: "Không tìm thấy khiếu nại này về bạn, hoặc khiếu nại chưa được tiếp nhận"}
      - {code: INVALID_REQUEST, http: 400, meaning: complaintId không phải UUID}
    source:
      - controller: ComplaintController.findAgainstMeById (GET /api/v1/users/me/complaints/against-me/{complaintId})
      - service: ComplaintService.findAgainstMeById, isVisibleToRespondent, forRespondent
