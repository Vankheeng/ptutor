# Cấu hình công cụ cho assistant-service (pytest, ruff, mypy). Không đóng gói thành thư viện.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not contract and not eval'"
markers = [
    "db: cần PostgreSQL + pgvector (tầng T1, thiết kế 13 mục 13.1); tự bỏ qua khi không kết nối được",
    "contract: gọi backend thật (tầng T2); chạy tay bằng pytest -m contract",
    "eval: chạy bộ đánh giá; không chạy trong pytest thường",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ['.venv', 'migrations']
