          nullable: true
        goalsDescription:
          type: string
          nullable: true
        currentLevel:
          type: string
          nullable: true
        weakPoints:
          type: string
          nullable: true

    ApiResponseMetadata:
      type: object
      required:
        - success
        - code
        - message
        - errors
        - timestamp
        - path
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        errors:
