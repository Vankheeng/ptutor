# Tests use their own database, never the dev database: Spring Boot reads classpath:/config/ after the main
# application.yml, so only the URL changes. Create it once in the dev container:
#   docker exec ptutor-postgres psql -U postgres -c "CREATE DATABASE ptutor_test"
# Flyway builds the schema on the first run. Set TEST_DB_URL to use another server, e.g. in CI.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/ptutor_test}
