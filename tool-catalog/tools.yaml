  - func_code: list_my_notifications
    name: Liệt kê thông báo
    status: ready
    roles: [STUDENT, TUTOR]
    features: [notification]
    reversibility: READ_ONLY
    description: >
      Trả về các thông báo của người hỏi, mới nhất trước: tiêu đề, nội dung, loại sự kiện, đã đọc hay chưa, đối tượng liên
      quan. Dùng khi người dùng hỏi thông báo gần đây nói gì, vừa nhận thông báo về việc gì. Không dùng khi chỉ cần đếm
      thông báo chưa đọc (dùng count_my_unread_notifications) và không dùng để hỏi cách đánh dấu đã đọc (trả lời bằng tài liệu).
    example_questions:
      - Thông báo mới nhất của tôi nói gì vậy?
      - thong bao chua doc gan day
      - Thông báo về hợp đồng hôm qua là sao?
    negative_examples:
      - Tôi có bao nhiêu thông báo chưa đọc?
      - Làm sao đánh dấu tất cả đã đọc?
    request: {method: GET, path: /api/v1/users/me/notifications}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [READ, UNREAD], default: null, description: "UNREAD khi hỏi thông báo chưa đọc; để trống để lấy tất cả."}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/users/me/notifications?status=UNREAD&page=0&size=20"}
    response:
      wrapper: ApiResponse.data.content (phân trang)
      item_class: NotificationResponse
      schema:
        id: {type: UUID, description: Mã thông báo, keep: false, reason: Không có công cụ nào dùng mã này}
        title: {type: String, description: "Tiêu đề, tiếng Anh, do hệ thống hoặc PTutor soạn", keep: true}
        content: {type: String, description: "Nội dung, tiếng Anh với thông báo tự động; thông báo chung do PTutor soạn", keep: true, user_text: true}
        type: *enum_notification_type
        eventType: *enum_notification_event
        referenceType: *enum_notification_reference_type
        referenceId: {type: String, description: "Mã đối tượng liên quan theo referenceType (dạng chuỗi UUID)", keep: true, seen_id: true}
        isRead: {type: boolean, description: Đã đọc hay chưa, keep: true}
        createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm nhận thông báo, keep: true}
    max_items: 10
    result_selection: {strategy: newest, count_by: isRead}
    allow_empty_result: true
    empty_result_message: Bạn chưa có thông báo nào khớp điều kiện này.
    errors:
      - {code: INVALID_REQUEST, http: 400, meaning: Giá trị status không thuộc danh sách}
    source:
      - controller: NotificationController.findMine (GET /api/v1/users/me/notifications)
      - service: NotificationService.findMine
      - dto: NotificationResponse
      - enum: NotificationType, NotificationEventType, NotificationReferenceType, NotificationReadStatus
      - security: "SecurityConstants.NOTIFICATION_SELF_SERVICE_API hasAnyRole(STUDENT, TUTOR, EMPLOYEE, ADMIN)"
      - template: "service/NotificationTemplateFactory (tiêu đề, nội dung tiếng Anh)"

  - func_code: count_my_unread_notifications
    name: Đếm thông báo chưa đọc
    status: ready
    roles: [STUDENT, TUTOR]
    features: [notification]
    reversibility: READ_ONLY
    description: >
      Trả về số thông báo chưa đọc của người hỏi. Dùng khi người dùng hỏi có thông báo mới không, có bao nhiêu thông báo
      chưa đọc. Không dùng khi cần biết nội dung thông báo (dùng list_my_notifications với status UNREAD).
    example_questions:
      - Tôi có thông báo mới không?
      - co bao nhieu thong bao chua doc
      - Vậy còn mấy cái chưa đọc?
    negative_examples:
      - Thông báo mới nhất nói gì?
    request: {method: GET, path: /api/v1/users/me/notifications/unread-count}
    required_params: []
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/notifications/unread-count"}
    response:
      wrapper: ApiResponse.data (một đối tượng)
      item_class: UnreadCountResponse
      schema:
        unreadCount: {type: long, description: Số thông báo chưa đọc, keep: true}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors: []
    source:
      - controller: NotificationController.unreadCount (GET /api/v1/users/me/notifications/unread-count)
      - service: NotificationService.unreadCount
      - dto: UnreadCountResponse

  # ===================== Chỉ STUDENT =====================
  - func_code: get_my_student_profile
    name: Xem hồ sơ học viên
    status: ready
    roles: [STUDENT]
    features: [account]
    reversibility: READ_ONLY
    description: >
      Trả về hồ sơ học viên của người hỏi: tên gọi, khu vực, giới thiệu, phong cách học, trình độ, mục tiêu, điểm cần cải
      thiện. Dùng khi học viên hỏi hồ sơ của mình đang ghi gì, đã điền những mục nào. Không dùng để hỏi cách sửa hồ sơ hay
      đổi email (trả lời bằng tài liệu). Email, số điện thoại, họ, ngày sinh, địa chỉ chi tiết bị bỏ khỏi kết quả.
    example_questions:
      - Hồ sơ học viên của tôi đang ghi mục tiêu là gì?
      - ho so cua toi da dien trinh do chua
      - Khu vực trong hồ sơ của tôi là quận nào?
    negative_examples:
      - Đổi số điện thoại ở đâu?
    request: {method: GET, path: /api/v1/students/me}
    required_params: []
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/students/me"}
    response:
      wrapper: ApiResponse.data (một đối tượng)
      item_class: StudentProfileResponse
      schema:
        userId: {type: UUID, description: Mã tài khoản, keep: false, reason: Mã tài khoản nội bộ}
        studentId: {type: UUID, description: Mã hồ sơ học viên, keep: false, reason: Mã nội bộ}
        email: {type: String, description: Email, keep: false, reason: Dữ liệu liên hệ cá nhân}
        firstName: {type: String, description: Tên gọi, keep: true}
        lastName: {type: String, description: Họ, keep: false, reason: "Dữ liệu cá nhân; chỉ giữ tên gọi"}
        phone: {type: String, description: Số điện thoại, keep: false, reason: Dữ liệu liên hệ cá nhân}
        gender: *enum_gender
        dateOfBirth: {type: LocalDate, description: Ngày sinh, keep: false, reason: Dữ liệu cá nhân không cần cho câu trả lời}
        avatarUrl: {type: String, description: Ảnh đại diện, keep: false, reason: Không cần cho câu trả lời}
        address: {type: AddressResponse, keep: true, description: Khu vực, items_class: AddressResponse, items: *schema_address}
        introduction: {type: String, description: Giới thiệu bản thân, keep: true, user_text: true}
        learningStyle: {type: String, description: Phong cách học, keep: true, user_text: true}
        personalityTags: {type: String, description: Tính cách, keep: true, user_text: true}
        goalsDescription: {type: String, description: Mục tiêu học, keep: true, user_text: true}
        currentLevel: {type: String, description: Trình độ hiện tại, keep: true, user_text: true}
        weakPoints: {type: String, description: Điểm cần cải thiện, keep: true, user_text: true}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: STUDENT_PROFILE_NOT_FOUND, http: 404, meaning: Tài khoản chưa có hồ sơ học viên; gợi ý liên hệ PTutor}
    source:
      - controller: StudentProfileController.getCurrentProfile (GET /api/v1/students/me)
      - service: StudentProfileService.getCurrentProfile, findCurrentStudent
      - dto: StudentProfileResponse, AddressResponse
      - enum: Gender
      - security: "SecurityConstants.STUDENT_SELF_SERVICE_API hasRole(STUDENT)"

  - func_code: list_my_studying_requests
    name: Liệt kê tin tìm gia sư của tôi
    status: ready
    roles: [STUDENT]
    features: [studying-request]
    reversibility: READ_ONLY
    description: >
      Trả về các tin tìm gia sư học viên đã tạo: tiêu đề, môn, lớp, hình thức học, mức giá, trạng thái (bản nháp, chờ duyệt,
      đang mở, đã ghép…). Dùng khi học viên hỏi tin của mình đã được duyệt chưa, đang mở mấy tin, hoặc cần mã tin. Không
      dùng để xem đề nghị của gia sư vào tin (dùng list_offers_for_my_request) và không dùng để hỏi phí đăng tin (trả lời
      bằng tài liệu).
    example_questions:
      - Tin tìm gia sư của tôi đã được duyệt chưa?
      - tin dang cua toi dang o trang thai nao
      - Tôi có tin nào còn là bản nháp chưa trả phí không?
    negative_examples:
      - Có gia sư nào gửi đề nghị vào tin của tôi chưa?
      - Phí đăng tin bao nhiêu?
    request: {method: GET, path: /api/v1/students/me/studying-requests}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [DRAFT, PENDING_REVIEW, OPEN, MATCHED, CLOSED, CANCELLED, REJECTED], default: null, description: Chỉ điền khi học viên hỏi theo trạng thái.}
      - *p_page
      - {name: sort, in: query, type: Enum, enum: [DESC, ASC], default: DESC, description: "Thứ tự theo thời gian tạo; DESC là mới nhất trước. Chỉ điền ASC khi hỏi tin cũ nhất."}
    fixed_params: {size: 100}
    sort: "createdAt theo tham số sort (mặc định giảm dần)"
    example_call: {url: "{{base_url}}/api/v1/students/me/studying-requests?status=PENDING_REVIEW&page=0&size=20"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: StudyingRequestResponse, schema: *schema_studying_request}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa có tin tìm gia sư nào khớp điều kiện này.
    errors:
      - {code: STUDENT_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ học viên}
      - {code: INVALID_REQUEST, http: 400, meaning: "Giá trị status hoặc sort không thuộc danh sách"}
    source:
      - controller: StudyingRequestController.findMine (GET /api/v1/students/me/studying-requests)
      - service: StudyingRequestService.findMine
      - dto: StudyingRequestResponse, StudyingRequestResponse.Availability
      - enum: RequestStatus, LearningMode
      - security: "SecurityConstants.STUDENT_SELF_SERVICE_API hasRole(STUDENT)"
      - labels: "tự đặt; trang học viên hiển thị mã viết thường (studyingRequestUtils.statusLabel)"

  - func_code: get_my_studying_request
    name: Xem một tin tìm gia sư của tôi
    status: ready
    roles: [STUDENT]
    features: [studying-request]
    reversibility: READ_ONLY
    description: >
      Trả về đầy đủ một tin tìm gia sư của học viên: mô tả, mục tiêu, mức giá, khung giờ rảnh, trạng thái. Dùng khi học viên
      hỏi kỹ về một tin đã xuất hiện trong hội thoại. Không dùng để liệt kê tin (dùng list_my_studying_requests) và không dùng
      để xem đề nghị của gia sư (dùng list_offers_for_my_request).
    example_questions:
      - Tin tìm gia sư môn Lý của tôi đang để giá bao nhiêu?
      - tin do toi de lich ranh nhung ngay nao
      - Tin đó bị từ chối hay đang chờ duyệt?
    negative_examples:
      - Tôi có mấy tin đang mở?
    request: {method: GET, path: "/api/v1/students/me/studying-requests/{requestId}"}
    required_params:
      - {name: requestId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_studying_requests, list_offers_for_my_request, get_offer_for_my_request], description: Mã tin tìm gia sư. Chưa có thì gọi list_my_studying_requests trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/students/me/studying-requests/2e6b9d14-7a3c-4f05-8d1e-5c9a0b3f6e27"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: StudyingRequestResponse, schema: *schema_studying_request}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: STUDYING_REQUEST_NOT_FOUND, http: 404, meaning: Không tìm thấy tin này trong các tin của bạn}
      - {code: STUDENT_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ học viên}
      - {code: INVALID_REQUEST, http: 400, meaning: requestId không phải UUID}
    source:
      - controller: StudyingRequestController.findMineById (GET /api/v1/students/me/studying-requests/{requestId})
      - service: StudyingRequestService.findMineById
      - dto: StudyingRequestResponse

  - func_code: list_offers_for_my_request
    name: Liệt kê đề nghị dạy vào tin của tôi
    status: ready
    roles: [STUDENT]
    features: [matching]
    reversibility: READ_ONLY
    description: >
      Trả về các đề nghị dạy gia sư gửi vào một tin tìm gia sư của học viên, mới nhất trước: tên gọi gia sư, học phí đề xuất,
      hình thức dạy, thời gian có thể dạy, lời nhắn, trạng thái. Dùng khi học viên hỏi có gia sư nào gửi đề nghị chưa, đề
      nghị nào đang chờ. Không dùng cho đơn đăng ký học học viên gửi vào tin của gia sư (dùng list_my_applications_to_tutors).
    example_questions:
      - Có gia sư nào gửi đề nghị vào tin tìm gia sư của tôi chưa?
      - de nghi nao dang cho toi tra loi
      - Trong mấy đề nghị đó, ai đề xuất giá thấp nhất?
    negative_examples:
      - Các đơn tôi gửi cho gia sư sao rồi?
    request: {method: GET, path: "/api/v1/students/me/studying-requests/{studyingRequestId}/tutor-requests"}
    required_params:
      - {name: studyingRequestId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_studying_requests, get_my_studying_request], description: Mã tin tìm gia sư. Chưa có thì gọi list_my_studying_requests trước.}
    optional_params:
      - {name: status, in: query, type: Enum, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED], default: null, description: "PENDING khi hỏi đề nghị đang chờ trả lời."}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/students/me/studying-requests/2e6b9d14-7a3c-4f05-8d1e-5c9a0b3f6e27/tutor-requests?status=PENDING"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: TutorStudentRequestResponse, schema: *schema_tutor_offer}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Tin này chưa có đề nghị dạy nào khớp điều kiện.
    errors:
      - {code: STUDYING_REQUEST_NOT_FOUND, http: 404, meaning: Không tìm thấy tin này trong các tin của bạn}
      - {code: STUDENT_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ học viên}
      - {code: INVALID_REQUEST, http: 400, meaning: "Mã không phải UUID hoặc status không thuộc danh sách"}
    source:
      - controller: StudentTutorOfferController.findMine (GET /api/v1/students/me/studying-requests/{studyingRequestId}/tutor-requests)
      - service: TutorStudentRequestService.findMine (học viên)
      - mapper: TutorStudentRequestMapper.toResponse (nextStep)
      - dto: TutorStudentRequestResponse
      - enum: ApplicationStatus, TeachingMode
      - labels: "frontend components/student/StudentTutorOffers.tsx"

  - func_code: get_offer_for_my_request
    name: Xem một đề nghị dạy vào tin của tôi
    status: ready
    roles: [STUDENT]
    features: [matching]
    reversibility: READ_ONLY
    description: >
      Trả về một đề nghị dạy cụ thể gia sư gửi vào tin tìm gia sư của học viên: học phí đề xuất, thời gian có thể dạy, địa
      điểm, lời nhắn, trạng thái và bước tiếp theo. Dùng khi học viên hỏi kỹ về một đề nghị đã xuất hiện trong hội thoại.
      Không dùng để liệt kê đề nghị (dùng list_offers_for_my_request).
    example_questions:
      - Đề nghị của thầy Minh có lời nhắn gì?
      - de nghi do day truc tiep o dau
      - Đề nghị đó tôi chấp nhận rồi thì bước tiếp theo là gì?
    negative_examples:
      - Tin của tôi có bao nhiêu đề nghị?
    request: {method: GET, path: "/api/v1/students/me/studying-requests/{studyingRequestId}/tutor-requests/{tutorRequestId}"}
    required_params:
      - {name: studyingRequestId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_studying_requests, get_my_studying_request, list_offers_for_my_request], description: "Mã tin tìm gia sư chứa đề nghị (trường studyingRequestId của đề nghị)."}
      - {name: tutorRequestId, in: path, type: UUID, source: seen_ids, from_tools: [list_offers_for_my_request], description: Mã đề nghị dạy. Chưa có thì gọi list_offers_for_my_request trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/students/me/studying-requests/2e6b9d14-7a3c-4f05-8d1e-5c9a0b3f6e27/tutor-requests/7f1a3c62-0b9e-4d27-a5c8-6e2d1f4b9a03"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: TutorStudentRequestResponse, schema: *schema_tutor_offer}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: STUDYING_REQUEST_NOT_FOUND, http: 404, meaning: Không tìm thấy tin này trong các tin của bạn}
      - {code: TUTOR_STUDENT_REQUEST_NOT_FOUND, http: 404, meaning: Không tìm thấy đề nghị này trong tin}
      - {code: STUDENT_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ học viên}
      - {code: INVALID_REQUEST, http: 400, meaning: Mã không phải UUID}
    source:
      - controller: StudentTutorOfferController.findMineById
      - service: TutorStudentRequestService.findMineById (học viên)
      - dto: TutorStudentRequestResponse

  - func_code: list_my_applications_to_tutors
    name: Liệt kê đơn đăng ký học tôi đã gửi
    status: ready
    roles: [STUDENT]
    features: [matching]
    reversibility: READ_ONLY
    description: >
      Trả về các đơn đăng ký học học viên đã gửi vào tin nhận dạy của gia sư, mới nhất trước: tin nhận dạy, tên gọi gia sư,
      mức giá đề nghị, trạng thái và bước tiếp theo. Dùng khi học viên hỏi các đơn đã gửi được chấp nhận chưa. Không dùng cho
      đề nghị dạy gia sư gửi vào tin của học viên (dùng list_offers_for_my_request).
    example_questions:
      - Các đơn đăng ký học tôi gửi cho gia sư sao rồi?
      - don dang ky hoc nao duoc chap nhan
      - Đơn gửi cô Lan đó còn đang chờ à?
    negative_examples:
      - Có gia sư nào ứng tuyển tin của tôi chưa?
    request: {method: GET, path: /api/v1/students/me/student-tutor-requests}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [PENDING, ACCEPTED, REJECTED, CANCELLED], default: null, description: Chỉ điền khi học viên hỏi theo trạng thái.}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/students/me/student-tutor-requests?page=0&size=20"}
    response:
      wrapper: ApiResponse.data.content (phân trang)
      item_class: StudentTutorRequestMineResponse
      schema:
        id: {type: UUID, description: Mã đơn đăng ký học, keep: true, seen_id: true}
        teachingRequestId: {type: UUID, description: Mã tin nhận dạy, keep: false, reason: Không có công cụ học viên dùng mã này}
        teachingRequestTitle: {type: String, description: Tiêu đề tin nhận dạy, keep: true, user_text: true}
        subjectId: {type: UUID, description: Mã môn học, keep: false, reason: Mã nội bộ; đã có subjectName}
        subjectName: {type: String, description: "Tên môn học; rỗng khi môn tự nhập", keep: true}
        customSubjectName: {type: String, description: Tên môn tự nhập của tin nhận dạy, keep: true, user_text: true}
        tutorId: {type: UUID, description: Mã hồ sơ gia sư, keep: false, reason: Mã nội bộ}
        tutorFirstName: {type: String, description: Tên gọi của gia sư, keep: true}
        tutorLastName: {type: String, description: Họ của gia sư, keep: false, reason: "Dữ liệu cá nhân; chỉ giữ tên gọi"}
        tutorEmail: {type: String, description: Email gia sư, keep: false, reason: Dữ liệu liên hệ cá nhân}
        gradeId: {type: UUID, description: Mã lớp, keep: false, reason: Mã nội bộ; đã có gradeName}
        gradeName: {type: String, description: Lớp học viên đăng ký, keep: true}
        proposedPrice: {type: BigDecimal, description: Mức giá học viên đề nghị, đơn vị đồng, keep: true}
        learningMode: *enum_learning_mode
        preferredSchedule: {type: String, description: Lịch mong muốn, keep: true, user_text: true}
        message: {type: String, description: Lời nhắn cho gia sư, keep: true, user_text: true}
        status: *enum_application_status
        nextStep: *enum_next_step
        createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm gửi đơn, keep: true}
        updatedAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm cập nhật gần nhất, keep: false, reason: Không cần cho câu trả lời}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa gửi đơn đăng ký học nào khớp điều kiện này.
    errors:
      - {code: STUDENT_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ học viên}
      - {code: INVALID_REQUEST, http: 400, meaning: Giá trị status không thuộc danh sách}
    source:
      - controller: StudentTutorRequestStudentController.findMine (GET /api/v1/students/me/student-tutor-requests)
      - service: StudentTutorRequestService.findMineForStudent
      - mapper: StudentTutorRequestMapper.toMineResponse (nextStep)
      - dto: StudentTutorRequestMineResponse
      - labels: "tự đặt theo StudentTutorOffers.tsx; trang My requests to studying hiển thị mã tiếng Anh"

  - func_code: list_my_payment_installments
    name: Liệt kê kỳ học phí của một hợp đồng
    status: ready
    roles: [STUDENT]
    features: [payment]
    reversibility: READ_ONLY
    description: >
      Trả về các kỳ học phí của một hợp đồng đang hoạt động: số tiền, hạn đóng, đã đóng hay chưa, buổi học gắn với kỳ (hợp
      đồng tính theo buổi); lớp lọc đưa kỳ chưa đóng có hạn gần nhất lên trước, kèm tổng số kỳ và số kỳ chưa đóng. Dùng khi học viên hỏi kỳ học phí tiếp theo, còn nợ bao nhiêu, đã đóng kỳ nào.
      Không dùng để hỏi quy định đóng học phí (trả lời bằng tài liệu) hay lịch sử thanh toán VNPay (dùng list_my_transactions).
    example_questions:
      - Kỳ học phí tiếp theo của hợp đồng môn Toán khi nào phải đóng?
      - con no bao nhieu tien hoc phi
      - Hợp đồng đó tôi đã đóng mấy kỳ rồi?
    negative_examples:
      - Đóng học phí bằng ví được không?
    request: {method: GET, path: "/api/v1/students/me/contracts/{contractId}/payment-installments"}
    required_params:
      - {name: contractId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_contracts, get_my_contract], description: Mã hợp đồng người dùng đang nói tới. Chưa có thì gọi list_my_contracts trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/students/me/contracts/3f2c8a51-7d1e-4c55-9a0b-2b7e6f1d40e1/payment-installments"}
    response:
      wrapper: ApiResponse.data (danh sách)
      item_class: ContractPaymentInstallmentResponse
      schema:
        id: {type: UUID, description: Mã kỳ học phí, keep: false, reason: Không có công cụ nào dùng mã này}
        sequenceNumber: {type: Integer, description: Kỳ thứ mấy, keep: true}
        paymentPeriod: *enum_payment_period
        amount: {type: BigDecimal, description: Số tiền của kỳ, đơn vị đồng, keep: true}
        dueDate: {type: LocalDate, description: "Hạn đóng; với hợp đồng Mỗi buổi, kỳ chưa gắn buổi học thì rỗng và chưa đóng được", keep: true}
        lessonId: {type: UUID, description: "Buổi học gắn với kỳ (hợp đồng Mỗi buổi); rỗng nếu chưa gắn", keep: true, seen_id: true}
        status: *enum_installment_status
    max_items: 10
    result_selection: {strategy: installments_due_first, count_by: status}
    allow_empty_result: true
    empty_result_message: Hợp đồng này chưa có kỳ học phí nào.
    side_effects: "Giống get_my_contract: nếu hợp đồng đang hoạt động chưa có kỳ học phí, máy chủ tạo các kỳ trong lúc gọi API (một lần, lặp lại vô hại)."
    errors:
      - {code: CONTRACT_NOT_ACTIVE, http: 409, meaning: "Hợp đồng chưa ký hoặc đã kết thúc nên không xem được kỳ học phí", user_message: "Hợp đồng này chưa ở trạng thái Đang hoạt động nên chưa có kỳ học phí để xem."}
      - {code: CONTRACT_NOT_FOUND, http: 404, meaning: Không tìm thấy hợp đồng này trong tài khoản học viên của bạn}
      - {code: INVALID_CONTRACT_PAYMENT_AMOUNT, http: 409, meaning: "Hợp đồng có giá bằng 0 nên không tạo được kỳ học phí", user_message: "Hợp đồng này đang có giá bằng 0 nên hệ thống chưa tạo được các kỳ học phí. Bạn liên hệ PTutor để được kiểm tra lại."}
      - {code: STUDENT_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ học viên}
      - {code: INVALID_REQUEST, http: 400, meaning: contractId không phải UUID}
    source:
      - controller: PaymentController.installments (GET /api/v1/students/me/contracts/{contractId}/payment-installments)
      - service: PaymentService.findMyInstallments, findStudentContract; ContractPaymentInstallmentService.ensureForActiveContract
      - dto: ContractPaymentInstallmentResponse
      - enum: PaymentInstallmentStatus, PaymentPeriod
      - labels: "frontend components/student/StudentContractStatusBadge.tsx (dùng cho bảng Các kỳ thanh toán)"

  - func_code: list_contract_lessons_for_student
    name: Liệt kê buổi học của một hợp đồng (học viên)
    status: ready
    roles: [STUDENT]
    features: [lesson]
    reversibility: READ_ONLY
    description: >
      Trả về các buổi học của một hợp đồng học viên đang học, theo ngày và giờ: trạng thái (sắp diễn ra, chờ xác nhận, đã
      học, đã hủy), thời điểm gia sư đánh dấu đã dạy để tính hạn xác nhận 3 ngày. API không có bộ lọc; lớp lọc giữ mọi buổi
      chờ xác nhận trước, rồi buổi sắp diễn ra gần nhất, rồi buổi đã qua gần nhất. Dùng khi học viên hỏi buổi nào đang chờ
      xác nhận, buổi nào còn hạn để yêu cầu hoàn tiền. Không dùng để xem kỳ học phí (dùng list_my_payment_installments) và
      không dùng để hỏi quy định xác nhận buổi học (trả lời bằng tài liệu).
    example_questions:
      - Hợp đồng Toán có buổi nào đang chờ tôi xác nhận không?
      - buoi hoc nao sap het han xac nhan
      - Buổi ngày 5 đó gia sư đánh dấu đã dạy lúc nào?
    negative_examples:
      - Không xác nhận buổi học thì sao?
    request: {method: GET, path: "/api/v1/students/me/contracts/{contractId}/lessons"}
    required_params:
      - {name: contractId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_contracts, get_my_contract], description: Mã hợp đồng người dùng đang nói tới. Chưa có thì gọi list_my_contracts trước.}
    optional_params: []
    sort: "date tăng dần, rồi startTime (cố định trong service)"
    example_call: {url: "{{base_url}}/api/v1/students/me/contracts/3f2c8a51-7d1e-4c55-9a0b-2b7e6f1d40e1/lessons"}
    response: {wrapper: ApiResponse.data (danh sách), item_class: LessonResponse, schema: *schema_lesson}
    max_items: 10
    result_selection: {strategy: lessons_pending_first, count_by: status}
    allow_empty_result: true
    empty_result_message: Hợp đồng này chưa có buổi học nào.
    errors:
      - {code: CONTRACT_NOT_FOUND, http: 404, meaning: Không tìm thấy hợp đồng này trong tài khoản học viên của bạn}
      - {code: STUDENT_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ học viên}
      - {code: INVALID_REQUEST, http: 400, meaning: contractId không phải UUID}
    source:
      - controller: StudentContractLessonController.findAll (GET /api/v1/students/me/contracts/{contractId}/lessons)
      - service: LessonService.findByContractForStudent
      - dto: LessonResponse
      - enum: LessonStatus, TeachingMode
      - labels: "frontend components/refund/refundFormat.ts lessonStatusLabels"
    notes: "Danh sách không phân trang và không có bộ lọc trạng thái; chọn mục theo list_rules.strategies.lessons_pending_first."

  - func_code: list_my_refund_requests
    name: Liệt kê yêu cầu hoàn tiền của tôi
    status: ready
    roles: [STUDENT]
    features: [refund]
    reversibility: READ_ONLY
    description: >
      Trả về các yêu cầu hoàn tiền học viên đã gửi, mới nhất trước: hợp đồng, trạng thái, hạn phản hồi của gia sư, số tiền
      được hoàn. Dùng khi học viên hỏi yêu cầu hoàn tiền tới đâu, đã được hoàn chưa. Không dùng để hỏi mức hoàn theo quy định
      (trả lời bằng tài liệu) và không dùng để xem tiền hoàn đã vào ví (dùng list_my_wallet_transactions). Muốn gọi tên gia
      sư thì tra get_my_contract bằng contractId.
    example_questions:
      - Yêu cầu hoàn tiền của tôi tới đâu rồi?
      - da duoc hoan tien chua
      - Yêu cầu đó gia sư đã phản hồi chưa?
    negative_examples:
      - Gia sư vắng thì được hoàn bao nhiêu?
    request: {method: GET, path: /api/v1/students/me/refund-requests}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [PENDING, IN_REVIEW, REFUNDED, REJECTED, CANCELLED], default: null, description: Chỉ điền khi học viên hỏi theo trạng thái.}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/students/me/refund-requests?page=0&size=20"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: RefundRequestResponse, schema: *schema_refund_request}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa gửi yêu cầu hoàn tiền nào khớp điều kiện này.
    errors:
      - {code: INVALID_REQUEST, http: 400, meaning: Giá trị status không thuộc danh sách}
    source:
      - controller: StudentRefundRequestController.findMine (GET /api/v1/students/me/refund-requests)
      - service: RefundRequestService.findMine
      - mapper: RefundRequestViews.toResponse
      - dto: RefundRequestResponse
      - labels: "frontend components/refund/refundFormat.ts"

  - func_code: get_my_refund_request
    name: Xem một yêu cầu hoàn tiền của tôi
    status: ready
    roles: [STUDENT]
    features: [refund]
    reversibility: READ_ONLY
    description: >
      Trả về đầy đủ một yêu cầu hoàn tiền học viên đã gửi: các buổi bị phản đối, nguyên nhân đã chọn, ý kiến của gia sư, kết
      luận từng buổi, số tiền hoàn, lý do từ chối. Dùng khi học viên hỏi kỹ về một yêu cầu đã xuất hiện trong hội thoại. Không
      dùng để liệt kê (dùng list_my_refund_requests). Muốn gọi tên gia sư thì tra get_my_contract bằng contractId.
    example_questions:
      - Gia sư phản hồi thế nào về yêu cầu hoàn tiền của tôi?
      - yeu cau do bi tu choi vi sao
      - Trong yêu cầu đó tôi được hoàn bao nhiêu tiền?
    negative_examples:
      - Hủy yêu cầu hoàn tiền thế nào?
    request: {method: GET, path: "/api/v1/students/me/refund-requests/{refundRequestId}"}
    required_params:
      - {name: refundRequestId, in: path, type: UUID, source: seen_ids, from_tools: [list_my_refund_requests], description: Mã yêu cầu hoàn tiền. Chưa có thì gọi list_my_refund_requests trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/students/me/refund-requests/9b1d4c2e-0f3a-4e7b-8c61-5a2d9e7f1c34"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: RefundRequestResponse, schema: *schema_refund_request}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: REFUND_REQUEST_NOT_FOUND, http: 404, meaning: Không tìm thấy yêu cầu hoàn tiền này trong các yêu cầu bạn đã gửi}
      - {code: INVALID_REQUEST, http: 400, meaning: refundRequestId không phải UUID}
    source:
      - controller: StudentRefundRequestController.findMineById
      - service: RefundRequestService.findMineById, findDetailed, isStudent
      - dto: RefundRequestResponse

  # ===================== Chỉ TUTOR =====================
  - func_code: get_my_tutor_profile
    name: Xem hồ sơ gia sư
    status: ready
    roles: [TUTOR]
    features: [tutor-profile]
    reversibility: READ_ONLY
    description: >
      Trả về hồ sơ gia sư của người hỏi kèm trạng thái duyệt (chờ duyệt, đã xác minh, không được duyệt), lý do từ chối, các
      mục hồ sơ giảng dạy và số liệu (điểm đánh giá, số hợp đồng hoàn tất, tỉ lệ nhận lời, thời gian phản hồi). Dùng khi gia
      sư hỏi hồ sơ đã duyệt chưa, vì sao bị từ chối, hồ sơ đang ghi gì. Không dùng để hỏi cách sửa hồ sơ hay tiêu chí duyệt
      (trả lời bằng tài liệu). Hồ sơ không có điểm đề xuất.
    example_questions:
      - Hồ sơ gia sư của tôi đã được duyệt chưa?
      - vi sao ho so cua toi bi tu choi
      - Điểm đánh giá trung bình của tôi bây giờ là bao nhiêu?
    negative_examples:
      - Sửa hồ sơ xong có phải duyệt lại không?
    request: {method: GET, path: /api/v1/tutors/me}
    required_params: []
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/tutors/me"}
    response:
      wrapper: ApiResponse.data (một đối tượng)
      item_class: TutorSelfProfileResponse
      schema:
        tutorId: {type: UUID, description: Mã hồ sơ gia sư, keep: false, reason: Mã nội bộ}
        userId: {type: UUID, description: Mã tài khoản, keep: false, reason: Mã tài khoản nội bộ}
        email: {type: String, description: Email, keep: false, reason: Dữ liệu liên hệ cá nhân}
        firstName: {type: String, description: Tên gọi, keep: true}
        lastName: {type: String, description: Họ, keep: false, reason: "Dữ liệu cá nhân; chỉ giữ tên gọi"}
        phone: {type: String, description: Số điện thoại, keep: false, reason: Dữ liệu liên hệ cá nhân}
        gender: *enum_gender
        dateOfBirth: {type: LocalDate, description: Ngày sinh, keep: false, reason: Dữ liệu cá nhân không cần cho câu trả lời}
        avatarUrl: {type: String, description: Ảnh đại diện (link tạm), keep: false, reason: Không cần cho câu trả lời}
        address: {type: AddressResponse, keep: true, description: Khu vực, items_class: AddressResponse, items: *schema_address}
        introduction: {type: String, description: Giới thiệu bản thân, keep: true, user_text: true}
        experienceYears: {type: Integer, description: Số năm kinh nghiệm, keep: true}
        education: {type: String, description: Trình độ học vấn, keep: true, user_text: true}
        teachingStyleTags: {type: String, description: Từ khóa phong cách giảng dạy, keep: true, user_text: true}
        teachingMethodology: {type: String, description: Phương pháp giảng dạy, keep: true, user_text: true}
        strengthSubjects: {type: String, description: Môn học giảng dạy, keep: true, user_text: true}
        targetStudentType: {type: String, description: Đối tượng học viên phù hợp, keep: true, user_text: true}
        averageRating: {type: BigDecimal, description: Điểm đánh giá trung bình, keep: true}
        totalReviews: {type: Integer, description: Số lượt đánh giá, keep: true}
        completedContractsCount: {type: Integer, description: Số hợp đồng đã hoàn tất, keep: true}
        totalStudentsTaught: {type: Integer, description: Số học viên đã dạy, keep: true}
        acceptanceRate: {type: BigDecimal, description: "Tỉ lệ nhận lời (phần trăm); có thể rỗng", keep: true}
        avgResponseTimeHours: {type: BigDecimal, description: "Thời gian phản hồi trung bình (giờ); có thể rỗng", keep: true}
        profileStatus: *enum_tutor_profile_status
        profileReviewedAt: {type: LocalDateTime, time_zone: UTC, description: "Thời điểm duyệt hoặc từ chối gần nhất; rỗng khi đang chờ duyệt", keep: true}
        profileRejectionReason: {type: String, description: "Lý do từ chối hồ sơ; rỗng nếu không bị từ chối", keep: true, user_text: true}
        createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm tạo hồ sơ, keep: false, reason: Không cần cho câu trả lời}
        updatedAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm cập nhật gần nhất, keep: false, reason: Không cần cho câu trả lời}
    max_items: null
    allow_empty_result: false
