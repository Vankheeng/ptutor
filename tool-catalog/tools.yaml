    features: [lesson]
    reversibility: READ_ONLY
    description: >
      Trả về một buổi học cụ thể trong hợp đồng gia sư dạy: ngày giờ, trạng thái, thời điểm đánh dấu đã dạy, ghi chú. Dùng khi
      gia sư hỏi kỹ về một buổi đã xuất hiện trong hội thoại, ví dụ buổi trong yêu cầu hoàn tiền. Không dùng để liệt kê buổi
      học (dùng list_contract_lessons_for_tutor).
    example_questions:
      - Buổi học ngày 12 đó đang ở trạng thái gì?
      - buoi do toi danh dau da day luc nao
      - Buổi bị học viên phản đối đó tôi ghi chú gì?
    negative_examples:
      - Hợp đồng này còn mấy buổi?
    request: {method: GET, path: "/api/v1/tutors/me/lessons/{lessonId}"}
    required_params:
      - {name: lessonId, in: path, type: UUID, source: seen_ids, from_tools: [list_contract_lessons_for_tutor, list_refund_requests_on_my_contracts, get_refund_request_on_my_contract], description: Mã buổi học. Chưa có thì gọi list_contract_lessons_for_tutor trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/tutors/me/lessons/e3b6a0d8-1f47-4c29-9a5e-7d2c4b8f0e61"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: LessonResponse, schema: *schema_lesson}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: LESSON_NOT_FOUND, http: 404, meaning: Không tìm thấy buổi học này trong các hợp đồng bạn dạy}
      - {code: TUTOR_PROFILE_REQUIRED, http: 403, meaning: Tài khoản chưa có hồ sơ gia sư}
      - {code: INVALID_REQUEST, http: 400, meaning: lessonId không phải UUID}
    source:
      - controller: LessonController.findById (GET /api/v1/tutors/me/lessons/{lessonId})
      - service: LessonService.findById, findOwnedLesson
      - dto: LessonResponse

  - func_code: list_refund_requests_on_my_contracts
    name: Liệt kê yêu cầu hoàn tiền về hợp đồng của tôi (gia sư)
    status: ready
    roles: [TUTOR]
    features: [refund]
    reversibility: READ_ONLY
    description: >
      Trả về các yêu cầu hoàn tiền học viên gửi về hợp đồng gia sư dạy, mới nhất trước: môn, trạng thái, hạn phản hồi của
      gia sư, đã phản hồi chưa, kết quả. Dùng khi gia sư hỏi có yêu cầu hoàn tiền nào cần phản hồi, còn bao lâu. Không dùng
      để hỏi quy định mức hoàn (trả lời bằng tài liệu). Muốn gọi tên học viên thì tra get_my_contract bằng contractId.
    example_questions:
      - Có yêu cầu hoàn tiền nào tôi cần phản hồi không?
      - yeu cau hoan tien nao sap het han phan hoi
      - Yêu cầu của hợp đồng môn Toán đó kết luận chưa?
    negative_examples:
      - Học viên nghỉ thì được hoàn bao nhiêu phần trăm?
    request: {method: GET, path: /api/v1/tutors/me/refund-requests}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [PENDING, IN_REVIEW, REFUNDED, REJECTED, CANCELLED], default: null, description: "PENDING hoặc IN_REVIEW khi hỏi yêu cầu chưa có kết luận."}
      - *p_page
    fixed_params: {size: 100}
    sort: "createdAt giảm dần (cố định trong controller)"
    example_call: {url: "{{base_url}}/api/v1/tutors/me/refund-requests?status=PENDING&page=0&size=20"}
    response: {wrapper: ApiResponse.data.content (phân trang), item_class: RefundRequestResponse, schema: *schema_refund_request}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Không có yêu cầu hoàn tiền nào về hợp đồng của bạn khớp điều kiện này.
    errors:
      - {code: INVALID_REQUEST, http: 400, meaning: Giá trị status không thuộc danh sách}
    source:
      - controller: TutorRefundRequestController.findAll (GET /api/v1/tutors/me/refund-requests)
      - service: RefundRequestService.findForTutor
      - dto: RefundRequestResponse

  - func_code: get_refund_request_on_my_contract
    name: Xem một yêu cầu hoàn tiền về hợp đồng của tôi (gia sư)
    status: ready
    roles: [TUTOR]
    features: [refund]
    reversibility: READ_ONLY
    description: >
      Trả về một yêu cầu hoàn tiền học viên gửi về hợp đồng gia sư đang dạy: trạng thái, hạn phản hồi của gia sư, các buổi
      bị phản đối kèm nguyên nhân học viên chọn, ý kiến của gia sư và kết luận từng buổi, số tiền hoàn và phần gia sư nhận.
      Dùng khi gia sư hỏi về một yêu cầu cụ thể. Không dùng để liệt kê (dùng list_refund_requests_on_my_contracts). Muốn gọi
      tên học viên thì tra get_my_contract bằng contractId, không tự tách họ tên.
    example_questions:
      - Yêu cầu hoàn tiền của học viên môn Toán tôi phải phản hồi trước mấy giờ?
      - yeu cau hoan tien do ket luan the nao roi
      - Học viên nói tôi vắng những buổi nào trong yêu cầu đó?
      - Tôi được nhận bao nhiêu tiền từ yêu cầu hoàn tiền vừa rồi?
    negative_examples:
      - Học viên nghỉ thì được hoàn bao nhiêu phần trăm?
      - Tôi có bao nhiêu yêu cầu hoàn tiền đang chờ?
    request: {method: GET, path: "/api/v1/tutors/me/refund-requests/{refundRequestId}"}
    required_params:
      - {name: refundRequestId, in: path, type: UUID, source: seen_ids, from_tools: [list_refund_requests_on_my_contracts], description: Mã yêu cầu hoàn tiền. Chưa có thì gọi list_refund_requests_on_my_contracts trước.}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/tutors/me/refund-requests/9b1d4c2e-0f3a-4e7b-8c61-5a2d9e7f1c34"}
    response: {wrapper: ApiResponse.data (một đối tượng), item_class: RefundRequestResponse, schema: *schema_refund_request}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: REFUND_REQUEST_NOT_FOUND, http: 404, meaning: Không tìm thấy yêu cầu hoàn tiền này trên các hợp đồng bạn dạy}
      - {code: INVALID_REQUEST, http: 400, meaning: refundRequestId không phải UUID}
    source:
      - controller: TutorRefundRequestController.findById (GET /api/v1/tutors/me/refund-requests/{refundRequestId})
      - service: RefundRequestService.findForTutorById, findDetailed, isTutor
      - mapper: RefundRequestViews.toResponse, toDisputedLessons, toEvidence, fullName
      - dto: RefundRequestResponse, RefundRequestResponse.DisputedLesson, RefundRequestResponse.Evidence
      - enum: RefundRequestStatus, LessonOutcome
      - security: "SecurityConstants.TUTOR_SELF_SERVICE_API hasRole(TUTOR)"
      - labels: "frontend components/refund/refundFormat.ts"

  # ===================== Dự kiến (chưa có trên dev) =====================
  - func_code: list_my_support_requests
    name: Liệt kê yêu cầu hỗ trợ tôi đã gửi
    status: planned
    roles: [STUDENT, TUTOR]
    features: [account]
    reversibility: READ_ONLY
    description: >
      Trả về các yêu cầu hỗ trợ người hỏi đã gửi cho nhân viên chăm sóc khách hàng, mới nhất trước: mã hiển thị, trạng
      thái, câu hỏi (cắt ngắn), thời điểm gửi và trả lời. Dùng khi người dùng hỏi câu hỏi đã gửi nhân viên có trả lời chưa.
      Không dùng để gửi yêu cầu mới (trợ lý chỉ hướng dẫn mở hộp thoại gửi) và không dùng cho khiếu nại (dùng list_my_complaints).
    example_questions:
      - Câu hỏi tôi gửi nhân viên đã có trả lời chưa?
      - yeu cau ho tro cua toi sao roi
      - Cái yêu cầu hỗ trợ hôm qua đang ai xử lý?
    negative_examples:
      - Gửi câu hỏi cho nhân viên giúp tôi.
    request: {method: GET, path: /api/v1/users/me/support-requests}
    required_params: []
    optional_params:
      - {name: status, in: query, type: Enum, enum: [OPEN, IN_PROGRESS, ANSWERED, CLOSED, CANCELLED], default: null, description: "Chỉ điền khi người dùng hỏi theo trạng thái."}
    example_call: {url: "{{base_url}}/api/v1/users/me/support-requests"}
    response:
      wrapper: "ApiResponse.data (chưa chốt danh sách hay phân trang)"
      item_class: "chưa có (theo 14-yeu-cau-ho-tro.md mục 14.7)"
      schema:
        code: {type: String, description: "Mã hiển thị, ví dụ HT-000123", keep: true}
        status:
          type: Enum
          keep: true
          description: Trạng thái yêu cầu hỗ trợ
          enum_labels:
            OPEN: {label: Chờ xử lý, meaning: Chưa có nhân viên nhận}
            IN_PROGRESS: {label: Đang xử lý, meaning: Nhân viên chăm sóc khách hàng đang xử lý}
            ANSWERED: {label: Đã trả lời, meaning: Nhân viên đã trả lời}
            CLOSED: {label: Đã đóng, meaning: Người dùng xác nhận đã giải quyết}
            CANCELLED: {label: Đã hủy, meaning: Người dùng hủy khi còn chờ xử lý}
        question: {type: String, description: Câu hỏi đã gửi (cắt ngắn), keep: true, user_text: true}
        createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm gửi, keep: true}
        answeredAt: {type: LocalDateTime, time_zone: UTC, description: Thời điểm nhân viên trả lời, keep: true}
    max_items: 10
    result_selection: {strategy: newest, count_by: status}
    allow_empty_result: true
    empty_result_message: Bạn chưa gửi yêu cầu hỗ trợ nào.
    errors:
      - {code: RESOURCE_NOT_FOUND, http: 404, meaning: Backend chưa có API này}
    source:
      - design: "feat/support-chatbot:docs/support-chatbot/14-yeu-cau-ho-tro.md mục 14.5 (API), 14.6 (bảng support_requests), 14.7"
    notes: "Tên trường giữ đúng thiết kế 14 (hợp đồng giữa backend và chatbot, quyết định 2026-11-03). Nếu backend buộc phải đổi tên trường thì sửa 14-yeu-cau-ho-tro.md và tools.yaml trong cùng một lần; contract test giai đoạn 2 bắt lỗi khi hai bên lệch."

  - func_code: get_my_support_request
    name: Xem một yêu cầu hỗ trợ tôi đã gửi
    status: planned
    roles: [STUDENT, TUTOR]
    features: [account]
    reversibility: READ_ONLY
    description: >
      Trả về một yêu cầu hỗ trợ cụ thể người hỏi đã gửi, kèm câu trả lời của nhân viên nếu có. Dùng khi người dùng hỏi nhân
      viên đã trả lời gì cho một yêu cầu đã xuất hiện trong hội thoại. Không dùng để liệt kê (dùng list_my_support_requests).
    example_questions:
      - Nhân viên trả lời gì cho câu hỏi của tôi?
      - yeu cau HT-000123 tra loi chua
      - Câu trả lời đó gửi lúc nào?
    negative_examples:
      - Tôi đã gửi bao nhiêu yêu cầu hỗ trợ?
    request: {method: GET, path: "/api/v1/users/me/support-requests/{id}"}
    required_params:
      - {name: id, in: path, type: UUID, source: seen_ids, from_tools: [list_my_support_requests], description: "Mã yêu cầu hỗ trợ (id, không phải mã hiển thị HT-…). Chưa có thì gọi list_my_support_requests trước."}
    optional_params: []
    example_call: {url: "{{base_url}}/api/v1/users/me/support-requests/c1f0e9d2-4b7a-4e36-9d58-2a6b3c7e1f04"}
    response:
      wrapper: ApiResponse.data (một đối tượng)
      item_class: "chưa có (theo 14-yeu-cau-ho-tro.md)"
      schema:
        id: {type: UUID, description: Mã yêu cầu hỗ trợ, keep: true, seen_id: true}
        code: {type: String, description: Mã hiển thị, keep: true}
        status:
          type: Enum
          keep: true
          description: Trạng thái yêu cầu hỗ trợ
          enum_labels:
            OPEN: {label: Chờ xử lý, meaning: Chưa có nhân viên nhận}
            IN_PROGRESS: {label: Đang xử lý, meaning: Nhân viên chăm sóc khách hàng đang xử lý}
            ANSWERED: {label: Đã trả lời, meaning: Nhân viên đã trả lời}
            CLOSED: {label: Đã đóng, meaning: Người dùng xác nhận đã giải quyết}
            CANCELLED: {label: Đã hủy, meaning: Người dùng hủy khi còn chờ xử lý}
        question: {type: String, description: Câu hỏi đã gửi, keep: true, user_text: true}
        answer: {type: String, description: Câu trả lời của nhân viên; rỗng khi chưa trả lời, keep: true, user_text: true}
        createdAt: {type: LocalDateTime, time_zone: BACKEND_JVM, description: Thời điểm gửi, keep: true}
        answeredAt: {type: LocalDateTime, time_zone: UTC, description: Thời điểm trả lời, keep: true}
    max_items: null
    allow_empty_result: false
    empty_result_message: null
    errors:
      - {code: RESOURCE_NOT_FOUND, http: 404, meaning: "Backend chưa có API này, hoặc không tìm thấy yêu cầu"}
    source:
      - design: "feat/support-chatbot:docs/support-chatbot/14-yeu-cau-ho-tro.md mục 14.5, 14.6"
    notes: "Mục 3 của yêu cầu chỉ nêu một công cụ; file 14 có API xem chi tiết kèm câu trả lời nên đề xuất thêm. Tên trường giữ đúng thiết kế 14; đổi thì sửa 14 và tools.yaml cùng lúc."
