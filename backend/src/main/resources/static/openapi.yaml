openapi: 3.0.3
info:
  title: PTutor API
  version: 1.0.0
  description: API documentation for the PTutor tutoring platform.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Authentication
    description: Registration and authentication operations
  - name: Student Profile
    description: Operations for the authenticated student's own profile
  - name: Account
    description: Operations for the authenticated user's own account
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a student or tutor account
      description: Creates a user account and its student or tutor profile. Employee and admin registration is not allowed.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: student01@example.com
              password: Password123
              role: STUDENT
              firstName: Nguyen
              lastName: An
              phone: '0900000000'
              gender: MALE
              dateOfBirth: '2005-01-01'
              citizenId: '012345678901'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
      responses:
        '201':
          description: Account registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticates a student, tutor, employee or admin using email and password.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: student01@example.com
              password: Password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access and refresh tokens
      description: Rotates a valid opaque refresh token. An access JWT is not required for this endpoint.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: paste-refresh-token-here
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Revokes the supplied refresh token. The operation is idempotent and does not require an access JWT.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: paste-refresh-token-here
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/students/me:
    get:
      tags:
        - Student Profile
      summary: Get the authenticated student's profile
      description: Returns the profile associated with the user ID from the access JWT. Only students can call this endpoint.
      operationId: getCurrentStudentProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Student Profile
      summary: Partially update the authenticated student's profile
      description: Updates only non-null fields. Province and district IDs must be supplied together. Email and sensitive fields cannot be updated.
      operationId: updateCurrentStudentProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
            example:
              firstName: Nguyen Van
              phone: '0912345678'
              provinceId: 5f68e2cf-d21f-1c69-3fbd-1404b89f26ff
              districtId: 2f2dd357-1839-4330-2f8a-16c4b36cfd3a
              detailAddress: 123 Example Street
              introduction: I am preparing for university entrance exams.
      responses:
        '200':
          description: Student profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/password:
    put:
      tags:
        - Account
      summary: Change the authenticated user's password
      description: Changes the password for the user identified by the access JWT. Existing access and refresh tokens remain valid.
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: Password123
              newPassword: NewPassword456
              confirmNewPassword: NewPassword456
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedResponseEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
        - firstName
        - lastName
        - phone
        - gender
        - dateOfBirth
        - citizenId
        - provinceId
        - districtId
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date
        citizenId:
          type: string
          pattern: '^\d{12}$'
          example: '012345678901'
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1

    UpdateStudentProfileRequest:
      type: object
      description: At least one property must contain a non-null value.
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
          format: date
        avatarUrl:
          type: string
          maxLength: 500
        detailAddress:
          type: string
          maxLength: 255
        provinceId:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid
        introduction:
          type: string
        learningStyle:
          type: string
          maxLength: 50
        personalityTags:
          type: string
          maxLength: 255
        goalsDescription:
          type: string
        currentLevel:
          type: string
          maxLength: 50
        weakPoints:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmNewPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        confirmNewPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
            - EMPLOYEE
            - ADMIN

    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        accessTokenExpiresIn:
          type: integer
          format: int64
          example: 3600
        refreshTokenExpiresIn:
          type: integer
          format: int64
          example: 2592000
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - STUDENT
            - TUTOR
            - EMPLOYEE
            - ADMIN

    AddressResponse:
      type: object
      properties:
        detailAddress:
          type: string
          nullable: true
        districtId:
          type: string
          format: uuid
          nullable: true
        districtName:
          type: string
          nullable: true
        provinceId:
          type: string
          format: uuid
          nullable: true
        provinceName:
          type: string
          nullable: true

    StudentProfileResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        address:
          $ref: '#/components/schemas/AddressResponse'
        introduction:
          type: string
          nullable: true
        learningStyle:
          type: string
          nullable: true
        personalityTags:
          type: string
          nullable: true
        goalsDescription:
          type: string
          nullable: true
        currentLevel:
          type: string
          nullable: true
        weakPoints:
          type: string
          nullable: true

    ApiResponseMetadata:
      type: object
      required:
        - success
        - code
        - message
        - errors
        - timestamp
        - path
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    RegisterResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseMetadata'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegisterResponse'

    AuthTokenResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseMetadata'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokenResponse'

    StudentProfileResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseMetadata'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StudentProfileResponse'

    PasswordChangedResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseMetadata'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    LogoutResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseMetadata'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseMetadata'
        - type: object
          properties:
            data:
              nullable: true
              example: null

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: VALIDATION_ERROR
            message: Request validation failed
            data: null
            errors:
              email: Invalid email
            timestamp: '2026-08-30T10:00:00Z'
            path: /api/v1/auth/register

    UnauthorizedError:
      description: Authentication failed or token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: INVALID_CREDENTIALS
            message: Email or password is incorrect
            data: null
            errors: {}
            timestamp: '2026-08-30T10:00:00Z'
            path: /api/v1/auth/login

    ForbiddenError:
      description: The authenticated user does not have the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: FORBIDDEN
            message: You do not have permission to access this resource
            data: null
            errors: {}
            timestamp: '2026-08-30T10:00:00Z'
            path: /api/v1/students/me

    NotFoundError:
      description: The authenticated user or student profile was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: STUDENT_PROFILE_NOT_FOUND
            message: Student profile not found
            data: null
            errors: {}
            timestamp: '2026-08-30T10:00:00Z'
            path: /api/v1/students/me

    ConflictError:
      description: Request conflicts with existing data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: EMAIL_ALREADY_EXISTS
            message: Email is already registered
            data: null
            errors: {}
            timestamp: '2026-08-30T10:00:00Z'
            path: /api/v1/auth/register

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: INTERNAL_SERVER_ERROR
            message: An unexpected error occurred
            data: null
            errors: {}
            timestamp: '2026-08-30T10:00:00Z'
            path: /api/v1/auth/login
